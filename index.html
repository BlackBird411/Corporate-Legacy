      {found && (
        <React.Fragment>
          <div className="section-bar">Inventory</div>
          {invError && <div className="note err" role="alert" style={{ margin: "12px 18px 0" }}>{invError}</div>}
          <div className="inv-wrap">
            {INVENTORY_CATEGORIES.map(cat => (
              <InventoryCategory key={cat.key} label={cat.label} category={cat.key}
                items={profile.inventory ? profile.inventory[cat.key] : []}
                onAdd={onAddItem} onRemove={onRemoveItem} busyKey={invBusyKey} />
            ))}
          </div>

          <div className="section-bar">Admin actions on file</div>
          <div className="hist" style={{ marginTop: 14 }}>
            {(!profile.admin_actions || profile.admin_actions.length === 0) && (
              <div className="empty" style={{ padding: "14px 0" }}>No prior admin actions on file for this player.</div>
            )}
            {profile.admin_actions && profile.admin_actions.map(row => {
              const status = STATUS_STYLES[row.status] || STATUS_STYLES.pending;
              const p = row.payload || {};
              const amount = p.value !== undefined ? `→ ${p.value}`
                : (p.delta !== undefined ? `${p.delta > 0 ? "+" : ""}${p.delta}`
                : (p.itemName !== undefined ? p.itemName : "—"));
              return (
                <div key={row.id} className="hist-row">
                  <span className="led" style={{ "--c": status.color }}></span>
                  <span>{ACTION_LABELS[row.action_type] || row.action_type}</span>
                  <span className="c-gold">{amount}</span>
                  <span className="c-faint" style={{ marginLeft: "auto" }}>{new Date(row.created_at).toLocaleString()}</span>
                  {row.reason && <span className="log-sub" style={{ flexBasis: "100%" }}>Note: {row.reason}</span>}
                </div>
              );
            })}
          </div>

          <div className="dossier-foot">
            <button type="button" onClick={onEdit} className="btn btn-primary">Edit credits / XP</button>
          </div>
        </React.Fragment>
      )}
    </Panel>
  );
}

// =========================================================
// Moderation — warns / strikes / kicks / bans from mod_incidents.
// Available to every console role.
// =========================================================
const MOD_TYPE_COLORS = {
  WARN: "#E3B84A",
  STRIKE: "#F0883E",
  KICK: "#5AA9E6",
  BAN: "#E0603C",
  UNBAN: "#5BC98A",
};
const MOD_TYPES = ["WARN", "STRIKE", "KICK", "BAN", "UNBAN"];

function formatModDuration(sec) {
  if (sec === null || sec === undefined) return null;
  if (sec < 1) return "Permanent";
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return [d && `${d}d`, h && `${h}h`, m && `${m}m`].filter(Boolean).join(" ") || `${sec}s`;
}

const fetchModIncidents = (token, userId) =>
  api(LIST_MOD_URL, { token, body: userId ? { roblox_user_id: Number(userId) } : {} });

function ModerationPanel({ token }) {
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [incidents, setIncidents] = useState([]);
  const [summary, setSummary] = useState(null);
  const [subject, setSubject] = useState(null);
  const [typeFilter, setTypeFilter] = useState("ALL");
  const reqRef = useRef(0); // ignore responses from superseded requests

  const loadFeed = useCallback(async () => {
    const id = ++reqRef.current;
    setLoading(true); setError(null); setSubject(null); setSummary(null); setTypeFilter("ALL");
    try {
      const json = await fetchModIncidents(token, null);
      if (id !== reqRef.current) return;
      setIncidents(json.incidents || []);
    } catch (err) {
      if (id !== reqRef.current) return;
      setError(err.message || "Network error loading moderation records.");
    } finally {
      if (id === reqRef.current) setLoading(false);
    }
  }, [token]);

  useEffect(() => { if (token) loadFeed(); }, [loadFeed, token]);

  async function openPlayer(userId, name) {
    const id = ++reqRef.current;
    setLoading(true); setError(null); setTypeFilter("ALL");
    try {
      const json = await fetchModIncidents(token, userId);
      if (id !== reqRef.current) return;
      setIncidents(json.incidents || []);
      setSummary(json.summary || null);
      setSubject({ userId: String(userId), name: name || null });
    } catch (err) {
      if (id !== reqRef.current) return;
      setError(err.message || "Network error loading moderation records.");
    } finally {
      if (id === reqRef.current) setLoading(false);
    }
  }

  async function handleSearch(e) {
    e.preventDefault();
    const q = query.trim();
    if (!q) return;
    if (/^\d+$/.test(q)) return openPlayer(q, null);

    setLoading(true); setError(null);
    try {
      const j = await api(ROBLOX_LOOKUP_URL, { token, body: { username: q } });
      if (!j.data?.length) {
        setError("No Roblox user found with that username.");
        setLoading(false);
        return;
      }
      await openPlayer(j.data[0].id, j.data[0].name);
    } catch (err) {
      setError(err.status === 0 ? "Network error resolving that username." : err.message);
      setLoading(false);
    }
  }

  const shown = typeFilter === "ALL" ? incidents : incidents.filter(r => r.type === typeFilter);
  const displayName = subject ? (subject.name || incidents[0]?.target_name || `UserId ${subject.userId}`) : null;

  function banBadge() {
    if (!summary) return null;
    const st = summary.ban_status;
    if (st === "permanent") return { text: "BANNED — permanent", color: "var(--red)" };
    if (st === "active") return { text: `BANNED — until ${new Date(summary.ban_expires_at).toLocaleString()}`, color: "var(--red)" };
    if (st === "expired") return { text: "Last ban expired", color: "var(--text-faint)" };
    if (st === "lifted") return { text: "Ban lifted", color: "var(--green)" };
    return { text: "No bans on record", color: "var(--text-faint)" };
  }
  const badge = banBadge();

  return (
    <div className="col" style={{ gap: 18 }}>
      <form onSubmit={handleSearch} className="row">
        <input className="field grow" type="text" value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Search by Roblox UserId or username" aria-label="Search player" />
        <button type="submit" disabled={loading || !query.trim()} className="btn btn-primary">
          {loading ? "Searching…" : "Search"}
        </button>
        {subject && <button type="button" onClick={loadFeed} className="btn">Recent</button>}
      </form>

      {error && <div className="note err" role="alert">{error}</div>}

      {subject && summary && (
        <div className="subject-box">
          <div className="portrait">
            <img src={avatarHeadshotUrl(subject.userId)} alt={displayName} onError={(e) => { e.target.style.opacity = 0.15; }} />
          </div>
          <div className="grow" style={{ minWidth: 200 }}>
            <div className="subject-name" style={{ fontSize: 18 }}>{displayName}</div>
            <div className="subject-id">UserId {subject.userId}</div>
            <div style={{ marginTop: 7, fontWeight: 700, letterSpacing: "0.06em", color: badge.color }}>{badge.text}</div>
            <div className="c-dim" style={{ fontFamily: "var(--mono)", fontSize: 12 }}>
              Current strikes: <b className="c-gold" style={{ fontWeight: 400 }}>{summary.current_strikes}</b>
            </div>
          </div>
          <div className="chips">
            {MOD_TYPES.map(t => (
              <span key={t} className="badge" style={{ "--c": MOD_TYPE_COLORS[t] }}>{t} · {summary.counts[t] || 0}</span>
            ))}
          </div>
        </div>
      )}

      <Panel title={subject ? `Records — ${displayName}` : "Recent moderation activity"} tag={`${shown.length} shown`}
        actions={<RefreshButton onClick={() => (subject ? openPlayer(subject.userId, subject.name) : loadFeed())} disabled={loading} />}>
        <div className="row" style={{ marginBottom: 14 }}>
          <label className="lbl" htmlFor="mod-type">Type</label>
          <select id="mod-type" className="field sm" value={typeFilter} onChange={e => setTypeFilter(e.target.value)} style={{ width: 160 }}>
            <option value="ALL">All types</option>
            {MOD_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>

        {!error && !loading && shown.length === 0 && (
          <div className="empty">{subject ? "No moderation records on file for this player." : "No moderation activity logged yet."}</div>
        )}

        <div className="case-list">
          {shown.map(r => {
            const color = MOD_TYPE_COLORS[r.type] || "#B7AE92";
            const dur = formatModDuration(r.duration_seconds);
            return (
              <div key={r.incident_id} className="case" style={{ "--c": color }}>
                <div className="case-top">
                  <span className="badge" style={{ "--c": color }}>{r.type}</span>
                  <span className="case-id">{r.incident_id}</span>
                  <span className="case-time">{new Date(r.created_at).toLocaleString()}</span>
                </div>
                {!subject && (
                  <div className="row wrap" style={{ gap: 4 }}>
                    <b>{r.target_name || `uid:${r.target_user_id}`}</b>
                    <span className="c-faint" style={{ fontFamily: "var(--mono)", fontSize: 12 }}>({r.target_user_id})</span>
                    <button type="button" className="btn-link" onClick={() => openPlayer(r.target_user_id, r.target_name)}>View record</button>
                  </div>
                )}
                <div className="case-reason">{r.reason || "No reason provided"}</div>
                <div className="case-meta">
                  <span>Moderator: <b>{r.moderator_name || "unknown"}</b>{r.moderator_id ? ` (${r.moderator_id})` : ""}</span>
                  {dur && <span>Duration: <b>{dur}</b></span>}
                  {r.expires_at && <span>Expires: <b>{new Date(r.expires_at).toLocaleString()}</b></span>}
                  {r.strikes != null && <span>Strike total: <b>{r.strikes}</b></span>}
                </div>
                {r.notes && <div className="case-notes">Private notes: {r.notes}</div>}
              </div>
            );
          })}
        </div>
      </Panel>
    </div>
  );
}

// =========================================================
// Staff Management — owner only. Create and delete console accounts
// (rows in admin_logins) through the admin-staff-manage edge function.
// =========================================================
const STAFF_ROLE_OPTIONS = [
  { value: "game_moderator", label: "Game Moderator" },
  { value: "database_moderator", label: "Database Moderator" },
  { value: "owner", label: "Owner" },
];
const USERNAME_RE = /^[A-Za-z0-9_.-]{3,32}$/;

// Unbiased random password from an unambiguous alphabet (no 0/O, 1/l/I).
function generatePassword(length = 16) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const limit = 4294967296 - (4294967296 % chars.length);
  let out = "";
  while (out.length < length) {
    const buf = new Uint32Array(length);
    crypto.getRandomValues(buf);
    for (const n of buf) {
      if (n < limit && out.length < length) out += chars[n % chars.length];
    }
  }
  return out;
}

function ConfirmDialog({ title, children, confirmWord, confirmLabel, busy, error, onCancel, onConfirm }) {
  const [typed, setTyped] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) inputRef.current.focus();
    function onKey(e) { if (e.key === "Escape" && !busy) onCancel(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [busy, onCancel]);

  const ready = typed === confirmWord;

  return (
    <div className="backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget && !busy) onCancel(); }}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <div className="dialog-bar"><span id="dlg-title">{title}</span></div>
        <div className="dialog-body">
          {children}
          <label className="lbl-wrap" style={{ marginTop: 16 }}>
            <span className="lbl">Type <b style={{ color: "#FFB4A0" }}>{confirmWord}</b> to confirm</span>
            <input ref={inputRef} className="field" type="text" value={typed} onChange={e => setTyped(e.target.value)}
              autoComplete="off" spellCheck={false} disabled={busy}
              onKeyDown={e => { if (e.key === "Enter" && ready && !busy) { e.preventDefault(); onConfirm(); } }} />
          </label>
          {error && <div className="note err" role="alert" style={{ marginTop: 12 }}>{error}</div>}
          <div className="dialog-foot">
            <button type="button" className="btn" onClick={onCancel} disabled={busy}>Cancel</button>
            <button type="button" className="btn btn-danger solid" onClick={onConfirm} disabled={!ready || busy}>
              {busy ? "Deleting…" : confirmLabel}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function StaffManagement({ token }) {
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);

  const [form, setForm] = useState({ username: "", password: "", role: "game_moderator" });
  const [showPw, setShowPw] = useState(false);
  const [ownerAck, setOwnerAck] = useState(false);
  const [creating, setCreating] = useState(false);
  const [formError, setFormError] = useState(null);
  const [created, setCreated] = useState(null);
  const [copied, setCopied] = useState(null);

  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const [deleteError, setDeleteError] = useState(null);
  const [flash, setFlash] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const json = await api(STAFF_URL, { token, body: { action: "list" } });
      setStaff(json.staff || []);
      setLoadError(null);
    } catch (err) {
      setLoadError(
        err.status === 0 || err.status === 404
          ? "Couldn't reach the staff service. If the admin-staff-manage edge function isn't deployed yet, deploy it in Supabase and refresh."
          : err.message
      );
    } finally {
      setLoading(false);
    }
  }, [token]);

  useEffect(() => { if (token) load(); }, [load, token]);

  useEffect(() => {
    if (!flash) return;
    const id = setTimeout(() => setFlash(null), 5000);
    return () => clearTimeout(id);
  }, [flash]);

  const counts = useMemo(() => {
    const c = { owner: 0, database_moderator: 0, game_moderator: 0 };
    for (const m of staff) if (m.role in c) c[m.role]++;
    return c;
  }, [staff]);

  function setField(key, value) {
    setForm(f => ({ ...f, [key]: value }));
    if (key === "role") setOwnerAck(false);
  }

  async function copyText(text, key) {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(c => (c === key ? null : c)), 1800);
    } catch (_e) {
      setCopied("error");
    }
  }

  async function handleCreate(e) {
    e.preventDefault();
    setFormError(null);
    setCreated(null);

    const username = form.username.trim();
    if (!USERNAME_RE.test(username)) {
      setFormError("Username must be 3–32 characters: letters, numbers, dot, dash or underscore.");
      return;
    }
    if (form.password.length < 10) {
      setFormError("Password must be at least 10 characters. Use Generate for a strong one.");
      return;
    }
    if (form.role === "owner" && !ownerAck) {
      setFormError("Confirm that this account should have full owner access.");
      return;
    }

    setCreating(true);
    try {
      await api(STAFF_URL, { token, body: { action: "create", username, password: form.password, role: form.role } });
      setCreated({ username, role: form.role, password: form.password });
      setForm({ username: "", password: "", role: "game_moderator" });
      setOwnerAck(false);
      setShowPw(false);
      await load();
    } catch (err) {
      setFormError(err.message);
    } finally {
      setCreating(false);
    }
  }

  async function confirmDelete() {
    if (!deleteTarget) return;
    setDeleting(true);
    setDeleteError(null);
    try {
      await api(STAFF_URL, { token, body: { action: "delete", id: deleteTarget.id } });
      setFlash(`Deleted ${deleteTarget.username}. Any open sessions were signed out.`);
      setDeleteTarget(null);
      await load();
    } catch (err) {
      setDeleteError(err.message);
    } finally {
      setDeleting(false);
    }
  }

  const roleInfo = ROLES[form.role];

  return (
    <div className="staff-layout">
      <Panel title="Issue account" tag="Owner only">
        <form onSubmit={handleCreate} className="col" autoComplete="off">
          <fieldset className="fs">
            <legend>Credentials</legend>
            <input className="field" type="text" placeholder="Username" value={form.username} onChange={e => setField("username", e.target.value)}
              required autoComplete="off" spellCheck={false} autoCapitalize="none" disabled={creating} aria-label="Username" />
            <div className="row">
              <input className="field grow" type={showPw ? "text" : "password"} placeholder="Password (10+ characters)" value={form.password}
                onChange={e => setField("password", e.target.value)} required autoComplete="new-password" disabled={creating} aria-label="Password" />
              <button type="button" className="btn btn-sm" onClick={() => setShowPw(v => !v)} aria-pressed={showPw}>{showPw ? "Hide" : "Show"}</button>
            </div>
            <button type="button" className="btn btn-sm" disabled={creating}
              onClick={() => { setField("password", generatePassword(16)); setShowPw(true); }}>
              Generate strong password
            </button>
          </fieldset>

          <fieldset className="fs">
            <legend>Clearance</legend>
            <select className="field" value={form.role} onChange={e => setField("role", e.target.value)} disabled={creating} aria-label="Role">
              {STAFF_ROLE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
            <div className="role-blurb">{roleInfo ? `${roleInfo.clearance} — ${roleInfo.blurb}` : ""}</div>
            {form.role === "owner" && (
              <label className="ack">
                <input type="checkbox" checked={ownerAck} onChange={e => setOwnerAck(e.target.checked)} disabled={creating} />
                <span>This account gets full access, including creating and deleting staff.</span>
              </label>
            )}
          </fieldset>

          {formError && <div className="note err" role="alert">{formError}</div>}

          <button type="submit" disabled={creating} className="btn btn-primary">
            {creating ? "Issuing…" : "Create account"}
          </button>
        </form>

        {created && (
          <div className="cred" role="status">
            <div className="cred-title">Account issued</div>
            <div className="cred-note">The password is shown here once. Send it to {created.username} through a private channel.</div>
            <div className="cred-row"><span className="cred-k">Username</span><code className="cred-v">{created.username}</code>
              <button type="button" className="btn btn-sm" onClick={() => copyText(created.username, "u")}>{copied === "u" ? "Copied" : "Copy"}</button></div>
            <div className="cred-row"><span className="cred-k">Password</span><code className="cred-v">{created.password}</code>
              <button type="button" className="btn btn-sm" onClick={() => copyText(created.password, "p")}>{copied === "p" ? "Copied" : "Copy"}</button></div>
            <div className="cred-row"><span className="cred-k">Role</span><span style={{ color: roleColor(created.role), fontWeight: 700 }}>{roleLabel(created.role)}</span></div>
            {copied === "error" && <div className="cred-note" style={{ color: "#FFB4A0" }}>Couldn't access the clipboard. Select the text and copy it manually.</div>}
            <button type="button" className="btn btn-sm" style={{ marginTop: 10 }} onClick={() => setCreated(null)}>Dismiss</button>
          </div>
        )}
      </Panel>

      <Panel title="Access roster" tag={`${staff.length} accounts`} actions={<RefreshButton onClick={load} disabled={loading} />}>
        <div className="chips" style={{ marginBottom: 14 }}>
          {STAFF_ROLE_OPTIONS.slice().reverse().map(o => (
            <span key={o.value} className="badge" style={{ "--c": roleColor(o.value) }}>{o.label} · {counts[o.value]}</span>
          ))}
        </div>

        {flash && <div className="note ok" role="status" style={{ marginBottom: 12 }}>{flash}</div>}
        {loadError && <div className="note err" role="alert">{loadError}</div>}
        {!loadError && !loading && staff.length === 0 && <div className="empty">No accounts found.</div>}

        <div className="roster">
          {staff.map(m => (
            <div key={m.id} className="member" style={{ "--c": roleColor(m.role) }}>
              <div className="member-main">
                <div className="member-name">
                  {m.username}
                  {m.is_you && <span className="you">You</span>}
                </div>
                <div className="member-sub">Created {formatDateTime(m.created_at)}</div>
              </div>
              <span className="badge" style={{ "--c": roleColor(m.role) }}>{roleLabel(m.role)}</span>
              <div className="member-meta">
                <div>Last sign-in: <span className="c-gold">{relativeTime(m.last_login)}</span></div>
                <div>{m.active_sessions > 0
                  ? <span style={{ color: "var(--green)" }}>● {m.active_sessions} active session{m.active_sessions === 1 ? "" : "s"}</span>
                  : "No active sessions"}</div>
              </div>
              <button type="button" className="btn btn-danger btn-sm" disabled={m.is_you}
                title={m.is_you ? "You can't delete your own account" : `Delete ${m.username}`}
                onClick={() => { setDeleteError(null); setDeleteTarget(m); }}>
                Delete
              </button>
            </div>
          ))}
        </div>
      </Panel>

      {deleteTarget && (
        <ConfirmDialog
          title="Revoke and delete account"
          confirmWord={deleteTarget.username}
          confirmLabel="Delete account"
          busy={deleting}
          error={deleteError}
          onCancel={() => { if (!deleting) setDeleteTarget(null); }}
          onConfirm={confirmDelete}
        >
          <p style={{ margin: 0, lineHeight: 1.5 }}>
            This permanently deletes <b>{deleteTarget.username}</b> ({roleLabel(deleteTarget.role)}) and signs out any open sessions.
            Their past activity stays in the Activity Log.
          </p>
        </ConfirmDialog>
      )}
    </div>
  );
}

function Sidebar({ tabs, activeTab, setActiveTab, adminInfo, onSignOut }) {
  const initials = (adminInfo.username || "?").slice(0, 2).toUpperCase();
  return (
    <aside className="v-rail">
      <div className="v-brand">
        <Glyph size={30} />
        <div>
          <div className="v-brand-name">VEYRATHIS</div>
          <div className="v-brand-sub">OPS {BUILD}</div>
        </div>
      </div>

      <div className="v-operator">
        <div className="v-avatar">{initials}</div>
        <div style={{ minWidth: 0 }}>
          <div className="v-op-name">{adminInfo.username}</div>
          <div className="v-op-meta" style={{ color: roleColor(adminInfo.role) }}>{roleLabel(adminInfo.role)}</div>
          <div className="v-op-meta">{clearanceOf(adminInfo.role)}</div>
        </div>
      </div>

      <div>
        <div className="v-nav-label" style={{ marginBottom: 8 }}>Sections</div>
        <nav className="v-nav" aria-label="Console sections">
          {NAV_ITEMS.filter(item => tabs.includes(item.key)).map(item => (
            <button key={item.key} type="button" onClick={() => setActiveTab(item.key)}
              className={"v-nav-item" + (activeTab === item.key ? " active" : "")}
              aria-current={activeTab === item.key ? "page" : undefined}>
              {item.label}
            </button>
          ))}
        </nav>
      </div>

      <div className="v-rail-foot">
        <div className="v-rail-note">Session bound to this browser tab. Closing it ends your access.</div>
        <button type="button" className="btn btn-sm" onClick={() => onSignOut()}>Sign out</button>
      </div>

}

function TopBar({ activeTab, showPending, pendingCount, lastSync, loginAt }) {
  const now = useClock();
  const online = useOnline();
  const elapsed = loginAt ? Math.max(0, Math.floor((now.getTime() - loginAt) / 1000)) : null;
  const sections = { actions: "Actions", personnel: "Personnel", moderation: "Moderation", activity: "Activity", staff: "Staff" };
  return (
    <header className="v-top">
      <div>
        <div className="v-crumb">VEY <span>/</span> OPS <span>/</span> <b>{(sections[activeTab] || "Console").toUpperCase()}</b></div>
        <h1 className="v-title">{TAB_TITLES[activeTab] || "Console"}</h1>
      </div>
      <div className="v-vitals">
        <span className="v-vital">
          <span className="led pulse" style={{ "--c": online ? "var(--green)" : "var(--red)" }} />
          <span className="v-vital-v">{online ? "Link secure" : "Link lost"}</span>
        </span>
        {showPending && (
          <React.Fragment>
            <span className="v-vital"><span className="v-vital-k">PENDING</span><span className="v-vital-v" style={{ color: pendingCount > 0 ? "var(--gold-bright)" : "var(--text-faint)" }}>{pendingCount}</span></span>
            <span className="v-vital"><span className="v-vital-k">SYNC</span><span className="v-vital-v">{lastSync}</span></span>
          </React.Fragment>
        )}
        {elapsed !== null && <span className="v-vital"><span className="v-vital-k">SESSION</span><span className="v-vital-v">{formatElapsed(elapsed)}</span></span>}
        <span className="v-vital"><span className="v-vital-k">UTC</span><span className="v-vital-v">{now.toISOString().slice(11, 19)}</span></span>
      </div>
    </header>
  );
}

// =========================================================
// App shell
// =========================================================
function readStored(key) {
  try { return sessionStorage.getItem(key); } catch (_e) { return null; }
}

function App() {
  const [token, setToken] = useState(() => readStored("admin_token"));
  const [adminInfo, setAdminInfo] = useState(() => {
    try { const raw = readStored("admin_info"); return raw ? JSON.parse(raw) : null; } catch (_e) { return null; }
  });
  const [loginAt, setLoginAt] = useState(() => Number(readStored("admin_login_at")) || null);
  const [notice, setNotice] = useState(null);
  const [granted, setGranted] = useState(null);
  const [refreshSignal, setRefreshSignal] = useState(0);
  const [requestedTab, setRequestedTab] = useState(null);
  const [prefill, setPrefill] = useState({ userId: "", username: "" });
  const [pendingCount, setPendingCount] = useState(0);
  const [lastSync, setLastSync] = useState("—");

  // Tell the boot screen the interface is ready.
  useEffect(() => { if (window.__veyBootReady) window.__veyBootReady(); }, []);

  const allowedTabs = useMemo(() => tabsForRole(adminInfo && adminInfo.role), [adminInfo]);
  const activeTab = allowedTabs.includes(requestedTab) ? requestedTab : (allowedTabs[0] || null);
  const canSeeActions = allowedTabs.includes("actions");

  const handleLoginSuccess = useCallback((newToken, admin) => {
    const at = Date.now();
    try {
      sessionStorage.setItem("admin_token", newToken);
      sessionStorage.setItem("admin_info", JSON.stringify(admin));
      sessionStorage.setItem("admin_login_at", String(at));
    } catch (_e) { /* storage unavailable — session lasts until reload */ }
    setNotice(null);
    setRequestedTab(null);
    setLoginAt(at);
    setToken(newToken);
    setAdminInfo(admin);
    setGranted({ username: admin.username, role: admin.role });
  }, []);

  const handleSignOut = useCallback((message) => {
    try {
      sessionStorage.removeItem("admin_token");
      sessionStorage.removeItem("admin_info");
      sessionStorage.removeItem("admin_login_at");
    } catch (_e) { /* ignore */ }
    setToken(null);
    setAdminInfo(null);
    setLoginAt(null);
    setGranted(null);
    setRequestedTab(null);
    setPrefill({ userId: "", username: "" });
    setPendingCount(0);
    setNotice(typeof message === "string" ? message : null);
  }, []);

  // Any 401 from any endpoint signs the user out cleanly.
  useEffect(() => {
    unauthorizedHandler = () => handleSignOut("Your session expired. Sign in again to continue.");
    return () => { unauthorizedHandler = null; };
  }, [handleSignOut]);

  // "Access granted" splash after a successful sign-in.
  useEffect(() => {
    if (!granted) return;
    const id = setTimeout(() => setGranted(null), REDUCE_MOTION ? 500 : 1900);
    return () => clearTimeout(id);
  }, [granted]);

  const handleEditFromProfile = useCallback(({ userId, username }) => {
    setPrefill({ userId, username });
    setRequestedTab("actions");
  }, []);

  // Pending-count poll — only for roles that can see the Actions log.
  useEffect(() => {
    if (!token || !canSeeActions) return;
    let cancelled = false;
    async function poll() {
      try {
        const json = await api(LIST_ACTIONS_URL, { token });
        if (cancelled) return;
        if (json.actions) {
          setPendingCount(json.actions.filter(r => r.status === "pending" || r.status === "broadcast").length);
        }
        setLastSync(new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }));
      } catch (_err) { /* silent — top bar is non-critical */ }
    }
    poll();
    const id = setInterval(poll, 15000);
    return () => { cancelled = true; clearInterval(id); };
  }, [token, refreshSignal, canSeeActions]);

  const grantedOverlay = granted && (
    <div className="granted" role="status" onClick={() => setGranted(null)}>
      <Glyph size={46} />
      <h2 className="granted-title">ACCESS GRANTED</h2>
      <div className="granted-line"></div>
      <div className="granted-sub">{granted.username} — {roleLabel(granted.role)} — {clearanceOf(granted.role)}</div>
    </div>
  );

  if (!token || !adminInfo) return <Login onLoginSuccess={handleLoginSuccess} notice={notice} />;

  return (
    <div className="v-app">
      <Banner />
      <div className="v-shell">
        <Sidebar tabs={allowedTabs} activeTab={activeTab} setActiveTab={setRequestedTab} adminInfo={adminInfo} onSignOut={handleSignOut} />

        <div className="v-main">
          <TopBar activeTab={activeTab} showPending={canSeeActions} pendingCount={pendingCount} lastSync={lastSync} loginAt={loginAt} />

          <main className="v-content">
            {!activeTab && (
              <div className="grid-1" style={{ maxWidth: 640 }}>
                <Panel title="No clearance">
                  <div className="note err">Your account role ({roleLabel(adminInfo.role)}) isn't assigned to any console section.</div>
                  <p style={{ color: "var(--text-dim)", marginBottom: 0 }}>Ask an owner to update your role, then sign in again.</p>
                </Panel>
              </div>
            )}

            {activeTab === "actions" && (
              <div className="grid-2">
                <Panel title="Set credits / XP" tag="Form">
                  <ActionForm token={token} onActionComplete={() => setRefreshSignal(n => n + 1)}
                    prefillUserId={prefill.userId} prefillUsername={prefill.username} />
                </Panel>
                <ActionHistory token={token} refreshSignal={refreshSignal} />
              </div>
            )}
            {activeTab === "personnel" && (
              <div className="grid-1"><PersonnelDatabase token={token} onEditPlayer={handleEditFromProfile} /></div>
            )}
            {activeTab === "moderation" && (
              <div className="grid-1"><ModerationPanel token={token} /></div>
            )}
            {activeTab === "activity" && (
              <div className="grid-1" style={{ maxWidth: 1040 }}><ActivityLog token={token} /></div>
            )}
            {activeTab === "staff" && <StaffManagement token={token} />}
          </main>
        </div>
      </div>
      <Banner />
      {grantedOverlay}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);

</script>
<script>
/* Veyrathis Operations Console: Bureau skin. DOM + canvas only; never touches your React state, endpoints or auth. */
(() => {
"use strict";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 1. Stylesheet: same brass/gold palette, new structure ---------- */

/* ---------- 2. Holographic Earth ---------- */
const LAND = [ // rough continent outlines as [lon, lat]
  [[-168,66],[-140,70],[-110,72],[-82,70],[-62,58],[-55,48],[-70,43],[-76,35],[-81,25],[-97,26],[-96,16],[-83,9],[-78,8],[-92,15],[-105,22],[-112,30],[-118,33],[-124,40],[-125,49],[-135,58],[-150,60],[-165,55]],
  [[-55,60],[-45,60],[-20,70],[-20,82],[-45,83],[-65,80],[-58,70]],
  [[-78,8],[-62,11],[-50,0],[-35,-6],[-40,-22],[-50,-30],[-58,-38],[-65,-42],[-68,-52],[-72,-52],[-74,-40],[-71,-20],[-81,-5]],
  [[-10,36],[-9,43],[-2,48],[5,52],[8,57],[12,56],[20,60],[28,70],[40,68],[40,55],[30,46],[26,40],[20,38],[12,38],[2,38]],
  [[-17,21],[-10,35],[10,37],[22,33],[32,31],[34,28],[43,12],[51,11],[40,-2],[40,-16],[33,-26],[20,-35],[12,-18],[9,-1],[8,4],[-8,4],[-17,14]],
  [[28,40],[40,42],[50,40],[60,45],[70,55],[80,73],[110,77],[140,72],[170,69],[180,65],[160,58],[142,52],[135,43],[122,40],[122,30],[110,20],[106,10],[100,2],[98,15],[92,22],[80,10],[72,20],[67,25],[57,25],[50,30],[43,14],[36,36]],
  [[114,-22],[122,-18],[131,-12],[142,-11],[146,-19],[153,-27],[150,-37],[140,-38],[130,-32],[115,-34]],
  [[-8,50],[2,51],[0,58],[-6,58]], [[130,32],[141,36],[142,44],[137,37]], [[95,5],[106,-6],[120,-9],[140,-4],[130,2],[110,2]]
];
const NODES = [[40.7,-74,"NYC"],[51.5,-.1,"LDN"],[35.7,139.7,"TYO"],[-33.9,151.2,"SYD"],[-23.5,-46.6,"SAO"],[25.2,55.3,"DXB"]];
const ARCS = [[0,1],[1,5],[5,2],[2,3],[0,4],[4,1]];
const vec = (la, lo) => { const a = la * Math.PI / 180, b = lo * Math.PI / 180; return [Math.cos(a) * Math.sin(b), Math.sin(a), Math.cos(a) * Math.cos(b)]; };
const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const a = p[i], b = p[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
const LAND_V = [], GRAT = [];
for (let la = -84; la <= 84; la += 3.4) { const stp = Math.min(40, 3.4 / Math.max(.08, Math.cos(la * Math.PI / 180))); for (let lo = -180; lo < 180; lo += stp) if (la < -72 || LAND.some(p => inPoly(lo, la, p))) LAND_V.push(vec(la, lo)); }
for (let la = -60; la <= 60; la += 30) { const l = []; for (let lo = 0; lo <= 360; lo += 6) l.push(vec(la, lo)); GRAT.push(l); }
for (let lo = 0; lo < 360; lo += 30) { const l = []; for (let la = -90; la <= 90; la += 6) l.push(vec(la, lo)); GRAT.push(l); }

const PT = { x: 0, y: 0 }; // pointer: tilts the globe, lights the panel under the cursor
addEventListener("pointermove", e => {
  PT.x = (e.clientX / innerWidth - .5) * 2; PT.y = (e.clientY / innerHeight - .5) * 2;
  const p = e.target.closest && e.target.closest(".panel");
  if (p) { const b = p.getBoundingClientRect(); p.style.setProperty("--mx", e.clientX - b.left + "px"); p.style.setProperty("--my", e.clientY - b.top + "px"); }
}, { passive: true });

function globe(size) {
  const wrap = document.createElement("div");
  wrap.className = "fed-globe"; wrap.style.maxWidth = size + "px"; wrap.setAttribute("aria-hidden", "true");
  wrap.innerHTML = '<div class="fg-beam"></div><div class="fg-base"></div>';
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = cv.height = Math.round(size * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); wrap.appendChild(cv);
  const S = size, cx = S / 2, cy = S * .46, R = S * .36, NV = NODES.map(n => vec(n[0], n[1]));
  let rot = 0, last = performance.now();
  const frame = now => {
    rot += REDUCE ? 0 : Math.min(64, now - last) * .00022; last = now;
    const r = rot + PT.x * .14, tl = .4 + PT.y * .1, c = Math.cos(r), s = Math.sin(r), ct = Math.cos(tl), st = Math.sin(tl);
    const P = v => { const z0 = v[2] * c - v[0] * s; return [cx + R * (v[0] * c + v[2] * s), cy - R * (v[1] * ct - z0 * st), v[1] * st + z0 * ct]; };
    const T = (x, y, z) => [cx + R * x, cy - R * (y * ct - z * st), y * st + z * ct];
    const seg = (lines, fa, ba, lw) => [false, true].forEach(f => { // far side dim, near side bright
      ctx.beginPath();
      lines.forEach(L => L.forEach((q, i) => { const p = L[i - 1]; if (p && (p[2] + q[2] > 0) === f) { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); } }));
      ctx.strokeStyle = f ? fa : ba; ctx.lineWidth = lw; ctx.stroke();
    });
    ctx.clearRect(0, 0, S, S);
    const g = ctx.createRadialGradient(cx, cy, R * .8, cx, cy, R * 1.22);
    g.addColorStop(0, "rgba(216,179,74,.16)"); g.addColorStop(1, "rgba(216,179,74,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.22, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(216,179,74,.045)"; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(240,207,106,.6)"; ctx.lineWidth = 1.2; ctx.stroke();
    seg(GRAT.map(l => l.map(P)), "rgba(216,179,74,.26)", "rgba(216,179,74,.07)", .7);

    const scan = ((now * .00032) % 1) * 2.4 - 1.2, bk = [[], [], []]; // land dots + sweeping scan band
    LAND_V.forEach(v => { const q = P(v); if (q[2] <= 0) { bk[0].push(q); return; } q[3] = Math.max(0, 1 - Math.abs((cy - q[1]) / R - scan) / .14); bk[q[3] > 0 ? 2 : 1].push(q); });
    ctx.fillStyle = "rgba(216,179,74,.16)"; bk[0].forEach(q => ctx.fillRect(q[0], q[1], 1.1, 1.1));
    ctx.fillStyle = "rgba(240,207,106,.8)"; bk[1].forEach(q => ctx.fillRect(q[0] - .8, q[1] - .8, 1.7, 1.7));
    bk[2].forEach(q => { const k = 1.7 + 1.8 * q[3]; ctx.fillStyle = "rgba(255,240,175," + (.8 + .2 * q[3]) + ")"; ctx.fillRect(q[0] - k / 2, q[1] - k / 2, k, k); });
    if (Math.abs(scan) < 1) {
      const y = cy - scan * R, w = R * Math.sqrt(1 - scan * scan), lg = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
      lg.addColorStop(0, "rgba(240,207,106,0)"); lg.addColorStop(.5, "rgba(240,207,106,.55)"); lg.addColorStop(1, "rgba(240,207,106,0)");
      ctx.strokeStyle = lg; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - w, y); ctx.lineTo(cx + w, y); ctx.stroke();
    }

    ARCS.forEach(([a, b], i) => { // great-circle links with travelling packets
      const A = NV[a], B = NV[b], om = Math.acos(Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]))), so = Math.sin(om) || 1;
      const at = t => { const f1 = Math.sin((1 - t) * om) / so, f2 = Math.sin(t * om) / so, h = 1 + .2 * Math.sin(Math.PI * t) * om; return P([0, 1, 2].map(k => (A[k] * f1 + B[k] * f2) * h)); };
      ctx.beginPath(); let pen = false;
      for (let k = 0; k <= 28; k++) { const q = at(k / 28); if (q[2] > .02) { pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true; } else pen = false; }
      ctx.strokeStyle = "rgba(240,207,106,.5)"; ctx.lineWidth = 1; ctx.stroke();
      const pk = at((now * .00016 + i * .17) % 1);
      if (pk[2] > .02) { ctx.fillStyle = "#FFF0AF"; ctx.shadowColor = "#F0CF6A"; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(pk[0], pk[1], 2, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
    });

    ctx.font = Math.max(8, S * .026) + "px 'Share Tech Mono',monospace"; // node markers
    NV.forEach((v, i) => {
      const q = P(v); if (q[2] < .05) return; const ph = (now * .0006 + i * .27) % 1;
      ctx.fillStyle = "#F0CF6A"; ctx.beginPath(); ctx.arc(q[0], q[1], 2.4, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(240,207,106," + .7 * (1 - ph) + ")"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(q[0], q[1], 3 + ph * 12, 0, 7); ctx.stroke();
      ctx.fillStyle = "rgba(234,227,206,.85)"; ctx.fillText(NODES[i][2], q[0] + 8, q[1] - 7);
    });

    const ring = []; for (let k = 0; k <= 90; k++) { const a = k / 90 * Math.PI * 2, x = 1.36 * Math.cos(a); ring.push(T(x * .9, x * .43, 1.36 * Math.sin(a))); }
    seg([ring], "rgba(240,207,106,.5)", "rgba(216,179,74,.12)", 1); // orbit ring + satellite
    const sa = now * .0007, sx = 1.36 * Math.cos(sa), sp = T(sx * .9, sx * .43, 1.36 * Math.sin(sa));
    ctx.fillStyle = sp[2] > 0 ? "#FFF0AF" : "rgba(216,179,74,.4)"; ctx.beginPath(); ctx.arc(sp[0], sp[1], 3, 0, 7); ctx.fill();
  };
  frame(last);
  if (!REDUCE) requestAnimationFrame(function loop(t) { if (!cv.isConnected) return; frame(t); requestAnimationFrame(loop); });
  return wrap;
}

/* ---------- 3. Original bureau seal (not any real agency's insignia) ---------- */
const LOGO = (document.querySelector('link[rel="icon"][sizes="256x256"]') || {}).href || "";
const seal = sz => '<img class="fed-seal" src="' + LOGO + '" width="' + sz + '" height="' + sz + '" alt="" style="flex:0 0 ' + sz + 'px">';

/* ---------- 4. Attach to the React-rendered DOM (idempotent) ---------- */
const MSG = "RESTRICTED // VEYRATHIS BUREAU OF OPERATIONS // AUTHORIZED PERSONNEL ONLY // ALL ACCESS IS LOGGED AND ATTRIBUTED // ";
function enhance() {
  document.querySelectorAll(".v-banner:not([data-f])").forEach(b => { // scrolling classification ticker
    b.setAttribute("data-f", 1); b.innerHTML = '<span class="fb-track"><span>' + MSG.repeat(5) + "</span><span>" + MSG.repeat(5) + "</span></span>";
  });
  document.querySelectorAll('svg[viewBox="0 0 32 32"]:not([data-f])').forEach(s => { // swap the glyph for the seal
    s.setAttribute("data-f", 1); const pc = s.parentElement.classList;
    s.insertAdjacentHTML("beforebegin", seal(pc.contains("login-brand") ? 96 : pc.contains("granted") ? 140 : 44)); s.style.display = "none";
  });
  document.querySelectorAll(".v-brand-sub:not([data-f])").forEach(n => { n.setAttribute("data-f", 1); n.textContent = "BUREAU OF OPERATIONS"; });

  const lc = document.querySelector(".login-card:not([data-f])"); // login: hero globe beside the card
  if (lc) {
    lc.setAttribute("data-f", 1); const wrap = lc.parentElement;
    if (lc.querySelector("form") && wrap.classList.contains("login-wrap") && !wrap.querySelector(":scope > .login-hero")) {
      const h = document.createElement("div"); h.className = "login-hero"; h.appendChild(globe(440));
      h.insertAdjacentHTML("beforeend", '<div class="lh-cap"><b>Global uplink</b></div><div class="lh-cap">Veyrathis Bureau of Operations \u00b7 Secure terminal</div>');
      wrap.insertBefore(h, lc);

  }

  const vc = document.querySelector(".v-content"); // console: briefing strip above every section
  if (vc) {

    if (!b) {
      b = document.createElement("section"); b.className = "panel brief";
      b.innerHTML = '<div class="b-main"><div class="b-title"></div><p class="b-sub">Every action in this console is logged and attributed to your account.</p><div class="b-stats"></div></div>';
      b.appendChild(globe(210)); vc.insertBefore(b, vc.firstChild);
    }
    const txt = s => (document.querySelector(s) || {}).textContent || "", m = document.querySelectorAll(".v-operator .v-op-meta");
    const name = "Welcome, " + txt(".v-op-name"), t = b.querySelector(".b-title"); if (t.textContent !== name) t.textContent = name;
    const html = [["Clearance", m[1] ? m[1].textContent : ""], ["Role", m[0] ? m[0].textContent : ""], ["Audit trail", "Active"]].map(x => '<div class="b-stat">' + x[0] + "<b>" + x[1] + "</b></div>").join("");
    const st = b.querySelector(".b-stats"); if (st.getAttribute("data-s") !== html) { st.setAttribute("data-s", html); st.innerHTML = html; }
  }
}
let queued = 0;
const run = () => { queued = 0; try { enhance(); } catch (e) { console.warn("[veyrathis-skin]", e); } };
new MutationObserver(() => { if (!queued) queued = requestAnimationFrame(run); }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
