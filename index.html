     screen paint immediately while these download. Order is preserved. -->

<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
  /* =========================================================
     Veyra — vintage browser-chrome admin console
     Paper-white surfaces, brass/gold rules. Variable names are kept
     as --xp-* since they're referenced throughout the style objects.
     ========================================================= */
  :root {
    --xp-desktop: #D8D3C4;
    --xp-desktop-dark: #C7C1AE;
    --xp-window: #FFFFFF;
    --xp-window-light: #FBFAF6;
    --xp-panel-inset: #FFFFFF;
    --xp-field: #FFFFFF;

    --xp-title-l: #8A6412;
    --xp-title-m: #B4901E;
    --xp-title-r: #8A6412;
    --xp-title-glow: #D8B34A;
    --xp-title-inactive-l: #A99A76;
    --xp-title-inactive-r: #C2B590;

    --xp-bevel-light: #FFFFFF;
    --xp-bevel-lightest: #FDFCF8;
    --xp-bevel-shadow: #C8C2AE;
    --xp-bevel-dark: #8C8672;
    --xp-field-border-top: #B7AE94;
    --xp-field-border-bottom: #EFEBDD;

    --xp-text: #1A1A16;
    --xp-text-dim: #4A463C;
    --xp-text-faint: #746E5C;
    --xp-text-titlebar: #FFFFFF;
    --xp-text-link: #7A4E00;

    --xp-selected: #B4901E;
    --xp-selected-bg: #F3E9CC;

    --xp-green: #2E7D2E;
    --xp-green-bright: #3D9B3D;
    --xp-green-dim: #E6F2E6;
    --xp-red: #A02A1E;
    --xp-red-bright: #C23A28;
    --xp-red-dim: #FBEAE4;
    --xp-gold: #8A6412;
    --xp-gold-bright: #B4901E;

    --sans: 'Tahoma', 'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif;
    --sans-display: 'Trebuchet MS', 'Tahoma', Verdana, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: var(--xp-desktop);
    color: var(--xp-text);
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: auto; min-height: 100%; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.55; }
  a { color: var(--xp-text-link); }
  :focus-visible { outline: 1px dotted #000000; outline-offset: 1px; }
  ::selection { background: var(--xp-selected); color: #fff; }
  ::-webkit-scrollbar { width: 16px; height: 16px; }
  ::-webkit-scrollbar-track { background: var(--xp-window); border-left: 1px solid var(--xp-bevel-shadow); }
  ::-webkit-scrollbar-thumb { background: var(--xp-window); border: 1px solid var(--xp-bevel-shadow); box-shadow: inset 1px 1px 0 var(--xp-bevel-light), inset -1px -1px 0 var(--xp-bevel-dark); }
  ::-webkit-scrollbar-thumb:hover { background: #DEDACB; }

  select { background-color: var(--xp-field); color: var(--xp-text); border: 1px solid var(--xp-field-border-top); }
  select option { background-color: var(--xp-field); color: var(--xp-text); }
  input[type="number"] { background-color: var(--xp-field); color: var(--xp-text); }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { opacity: 0.85; }
  input[type="checkbox"] { accent-color: #8A6412; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

  /* ---------- responsive behaviour for the inline-styled layout ---------- */
  @media (max-width: 900px) {
    .vey-shell { flex-direction: column; }
    .vey-sidebar { width: auto !important; border-right: none !important; border-bottom: 1px solid var(--xp-bevel-shadow); }
    .vey-nav { flex-direction: row !important; flex-wrap: wrap; margin-bottom: 12px !important; }
    .vey-sidebar-footer { flex-direction: row !important; align-items: center; justify-content: space-between; }
    .vey-grid { grid-template-columns: 1fr !important; max-width: 100% !important; }
    .vey-dossier-body { flex-direction: column; align-items: center; }

  @media (max-width: 700px) {

    .vey-desktop { padding: 0 !important; }

  /* =========================================================
     BOOT SEQUENCE — plain HTML/CSS/JS so it paints before React
     and Babel have finished downloading and compiling.
     ========================================================= */
  #boot {
    position: fixed; inset: 0; z-index: 10000; overflow: hidden;
    background: #05070b; color: #D8C48A;
    font-family: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, transform 0.8s ease, visibility 0s linear 0.8s;
  }
  #boot.boot-exit { opacity: 0; transform: scale(1.05); visibility: hidden; pointer-events: none; }

  .boot-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(180,144,30,0.16) 0%, rgba(5,7,11,0) 58%),
      radial-gradient(ellipse at 50% 120%, rgba(216,179,74,0.10) 0%, rgba(5,7,11,0) 60%),
      #05070b;
  }
  .boot-grid {
    position: absolute; left: -60%; right: -60%; bottom: 0; height: 52%;
    background-image:
      linear-gradient(rgba(216,179,74,0.26) 1px, transparent 1px),
      linear-gradient(90deg, rgba(216,179,74,0.26) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(520px) rotateX(64deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 88%);
            mask-image: linear-gradient(to top, #000 0%, transparent 88%);
    animation: boot-grid-move 2.4s linear infinite;
  }
  @keyframes boot-grid-move { from { background-position: 0 0; } to { background-position: 0 60px; } }
  .boot-scan {
    position: absolute; left: 0; right: 0; height: 2px; top: -2%;
    background: linear-gradient(90deg, transparent, rgba(240,207,106,0.85), transparent);
    box-shadow: 0 0 22px 4px rgba(216,179,74,0.35);
    animation: boot-scan 3.8s linear infinite;

  @keyframes boot-scan { 0% { top: -2%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { top: 102%; opacity: 0; } }
  .boot-crt {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  }
  .bc { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(216,179,74,0.7); }
  .bc-tl { top: 22px; left: 22px; border-top-width: 1px; border-left-width: 1px; }
  .bc-tr { top: 22px; right: 22px; border-top-width: 1px; border-right-width: 1px; }
  .bc-bl { bottom: 22px; left: 22px; border-bottom-width: 1px; border-left-width: 1px; }
  .bc-br { bottom: 22px; right: 22px; border-bottom-width: 1px; border-right-width: 1px; }
  .boot-meta { position: absolute; top: 28px; left: 58px; font-size: 11px; letter-spacing: 0.18em; color: rgba(216,196,138,0.55); }

  .boot-stage { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 20px; }
  .boot-core { position: relative; width: min(380px, 70vw); aspect-ratio: 1; }
  .boot-core svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .boot-readout {
    position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%);
    text-align: center; font-family: 'Orbitron', 'Share Tech Mono', monospace; color: #F0CF6A;
    text-shadow: 0 0 14px rgba(240,207,106,0.55);
  }
  #boot-pct { font-size: clamp(26px, 6vw, 38px); font-weight: 700; letter-spacing: 0.04em; line-height: 1; }
  .boot-unit { font-size: 10px; letter-spacing: 0.4em; margin-top: 6px; color: rgba(216,196,138,0.7); text-shadow: none; }

  .boot-title {
    margin: 18px -0.46em 0 0; font-family: 'Orbitron', 'Share Tech Mono', monospace; font-weight: 700;
    font-size: clamp(22px, 4.6vw, 34px); letter-spacing: 0.46em; color: #F3E3AE; text-align: center;
    text-shadow: 0 0 18px rgba(216,179,74,0.45);
    animation: boot-title-in 1.5s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    transition: text-shadow 0.4s ease;
  }
  @keyframes boot-title-in {
    from { opacity: 0; letter-spacing: 1.1em; filter: blur(7px); }
    to   { opacity: 1; letter-spacing: 0.46em; filter: blur(0); }
  }
  .boot-sub { margin-top: 8px; font-size: 12px; letter-spacing: 0.34em; color: rgba(216,196,138,0.75); text-align: center; min-height: 1.4em; }

  .boot-log { list-style: none; margin: 26px 0 0; padding: 0 0 0 14px; width: min(400px, 86vw); border-left: 1px solid rgba(216,179,74,0.45); }
  .boot-log li { display: flex; align-items: baseline; gap: 8px; font-size: 12px; line-height: 1.9; opacity: 0; transform: translateX(-6px); transition: opacity 0.3s ease, transform 0.3s ease; }
  .boot-log li.on { opacity: 1; transform: none; }
  .bl-n { color: #D8C48A; white-space: nowrap; }
  .bl-l { flex: 1; border-bottom: 1px dotted rgba(216,196,138,0.3); transform: translateY(-3px); min-width: 12px; }
  .bl-s { color: rgba(216,196,138,0.5); min-width: 62px; text-align: right; letter-spacing: 0.08em; }
  .bl-s.pending { animation: blink 1s ease-in-out infinite; }
  .bl-s.ok { color: #F0CF6A; }
  .bl-s.bad { color: #E0603C; }

  .boot-skip { position: absolute; bottom: -62px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 0.22em; color: rgba(216,196,138,0.45); opacity: 0; transition: opacity 0.6s ease; }
  .boot-skip.on { opacity: 1; }
  .boot-fail { margin-top: 22px; text-align: center; color: #E0603C; font-size: 12px; line-height: 1.7; max-width: 420px; }
  .boot-fail[hidden] { display: none; }
  .boot-fail button { margin-top: 10px; background: transparent; border: 1px solid #D8B34A; color: #F0CF6A; padding: 7px 18px; letter-spacing: 0.2em; font-family: inherit; }

  #boot.boot-done .boot-title { text-shadow: 0 0 30px rgba(240,207,106,0.95); }
  #boot.boot-done .boot-sub { color: #F0CF6A; }

  @media (prefers-reduced-motion: reduce) {
    .boot-grid, .boot-scan, .boot-title, .bl-s.pending { animation: none !important; }
    #boot, .boot-log li { transition-duration: 0.01ms !important; }
    @keyframes blink { 0%, 100% { opacity: 1; } }
    .liveDotSmall { animation: none !important; }
  }
  @media (max-width: 520px) { .boot-meta { display: none; } .boot-skip { bottom: -44px; } }
</style>

<script>
/* Boot sequence controller. Runs immediately, independent of React/Babel.
   The app calls window.__veyBootReady() once it has mounted; the sequence
   holds at 94% until then, so the animation reflects real load state. */
(function () {
  var boot = document.getElementById("boot");
  if (!boot) return;
  var root = document.getElementById("root");
  root.setAttribute("inert", "");

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MIN_MS = reduce ? 800 : 3800;
  var FAIL_MS = 15000;
  var SKIP_AFTER_MS = 700;

  var pctEl = document.getElementById("boot-pct");
  var ringEl = document.getElementById("boot-ring");
  var subEl = document.getElementById("boot-sub");
  var skipEl = document.getElementById("boot-skip");
  var failEl = document.getElementById("boot-fail");
  var svgEl = document.getElementById("boot-svg");
  var logItems = document.querySelectorAll("#boot-log li");

  var CIRC = 2 * Math.PI * 110;
  ringEl.style.strokeDasharray = CIRC;
  ringEl.style.strokeDashoffset = CIRC;
  if (reduce && svgEl.pauseAnimations) svgEl.pauseAnimations();

  // tick marks around the outer ring
  var ticks = document.getElementById("boot-ticks");
  var NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 90; i++) {
    var a = (i * 4) * Math.PI / 180;
    var r1 = 170, r2 = i % 5 === 0 ? 182 : 176;
    var ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", 200 + Math.cos(a) * r1);
    ln.setAttribute("y1", 200 + Math.sin(a) * r1);
    ln.setAttribute("x2", 200 + Math.cos(a) * r2);
    ln.setAttribute("y2", 200 + Math.sin(a) * r2);
    ticks.appendChild(ln);
  }

  var appReady = false;
  var uplink = null; // null = pending, true = reachable, false = unreachable
  window.__veyBootReady = function () { appReady = true; };

  // Real reachability check (opaque response is fine — we only need to know the host answers).
  (function () {
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 5000);
    fetch(window.VEY_CONFIG.SUPABASE_URL + "/rest/v1/", { method: "GET", mode: "no-cors", signal: ctl ? ctl.signal : undefined })
      .then(function () { uplink = true; })
      .catch(function () { uplink = false; })
      .then(function () { clearTimeout(to); });
  })();

  var steps = [
    { at: 350,  hold: 450, ready: function () { return true; },          text: function () { return "READY"; } },
    { at: 1100, hold: 450, ready: function () { return uplink !== null; }, text: function () { return uplink ? "ONLINE" : "OFFLINE"; }, bad: function () { return uplink === false; } },
    { at: 1850, hold: 450, ready: function () { return appReady; },        text: function () { return "LOADED"; } },
    { at: 2600, hold: 450, ready: function () { return true; },          text: function () { return "ACTIVE"; } }
  ];
  for (var s = 0; s < steps.length; s++) {
    steps[s].node = logItems[s];
    steps[s].status = logItems[s].querySelector(".bl-s");
  }

  var t0 = performance.now(), last = t0, shown = 0, finished = false, skipping = false, failShown = false;

  function setProgress(p) {
    ringEl.style.strokeDashoffset = CIRC * (1 - p);
    pctEl.textContent = Math.round(p * 100);
  }
  function resolveStep(st) {
    st.done = true;
    st.status.textContent = st.text();
    st.status.className = "bl-s " + (st.bad && st.bad() ? "bad" : "ok");
  }

  function frame(now) {
    if (finished) return;
    var el = now - t0, dt = now - last; last = now;
    var allDone = true;

    for (var i = 0; i < steps.length; i++) {
      var st = steps[i];
      if (!st.shown && (el >= st.at || skipping)) { st.shown = true; st.node.classList.add("on"); }
      if (st.shown && !st.done && ((el >= st.at + st.hold) || skipping) && st.ready()) resolveStep(st);
      if (!st.done) allDone = false;
    }

    if (el > SKIP_AFTER_MS && !skipEl.classList.contains("on")) skipEl.classList.add("on");

    var timeP = Math.min(el / MIN_MS, 1);
    var target = (allDone || skipping) && appReady ? 1 : Math.min(timeP, 0.94);
    shown += (target - shown) * (1 - Math.exp(-dt / 140));
    setProgress(shown);

    if (appReady && (skipping || (allDone && el >= MIN_MS)) && shown > 0.985) return finish();

    if (!appReady && el > FAIL_MS && !failShown) {
      failShown = true;
      failEl.hidden = false;
      subEl.textContent = "Load failed";
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    if (finished) return;
    finished = true;
    setProgress(1);
    subEl.textContent = "Interface online";
    boot.classList.add("boot-done");
    window.removeEventListener("keydown", onSkip);
    boot.removeEventListener("pointerdown", onSkip);
    setTimeout(function () {
      boot.classList.add("boot-exit");
      root.removeAttribute("inert");
      document.documentElement.classList.add("boot-complete");
      var firstInput = root.querySelector("input");
      if (firstInput) firstInput.focus();
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 1000);
    }, reduce ? 150 : 650);
  }

  function onSkip() {
    if (performance.now() - t0 < SKIP_AFTER_MS) return;
    skipping = true;
  }
  window.addEventListener("keydown", onSkip);
  boot.addEventListener("pointerdown", onSkip);

  requestAnimationFrame(function (n) { t0 = last = n; frame(n); });
})();
</script>

<script type="text/babel" data-presets="react">

// =========================================================
// CONFIG
// =========================================================
const SUPABASE_URL = (window.VEY_CONFIG && window.VEY_CONFIG.SUPABASE_URL) || "https://ngfkmluzrgbphgowrrul.supabase.co";
const fn = (slug) => `${SUPABASE_URL}/functions/v1/${slug}`;

const FUNCTION_URL = fn("trigger-admin-action");
const LIST_ACTIONS_URL = fn("list-admin-function");
const ROBLOX_LOOKUP_URL = fn("roblox-lookup");
const PROFILE_LOOKUP_URL = fn("player-profile-lookup");
const INVENTORY_ACTION_URL = fn("admin-inventory-action");
const LOGIN_FUNCTION_URL = fn("admin-login-function");
const LIST_ACTIVITY_URL = fn("list-admin-activity");
const LIST_MOD_URL = fn("list-mod-incidents");
const STAFF_URL = fn("admin-staff-manage");
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// =========================================================
// API layer — one place for auth headers, error shaping and
// automatic sign-out when the server rejects the session.
// =========================================================
class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}
let unauthorizedHandler = null;

async function api(url, { token, body } = {}) {
  const headers = {};
  if (token) headers.Authorization = `Bearer ${token}`;
  if (body !== undefined) headers["Content-Type"] = "application/json";

  let res;
  try {
    res = await fetch(url, {
      method: body !== undefined ? "POST" : "GET",
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (_e) {
    throw new ApiError("Network error — check your connection and try again.", 0);
  }

  let json = null;
  try { json = await res.json(); } catch (_e) { /* non-JSON body */ }

  if (res.status === 401 && token && unauthorizedHandler) unauthorizedHandler();
  if (!res.ok || (json && json.error)) {
    throw new ApiError((json && json.error) || `Request failed (${res.status}).`, res.status);
  }
  return json || {};
}

// =========================================================
// Live clock
// =========================================================
function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}
function formatClock(d) {
  const day = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "2-digit" });
  const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  return `${day} ${time}`;
}
function formatDateTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString(undefined, { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
}
function relativeTime(iso) {
  if (!iso) return "never";
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.floor(hr / 24);
  return d === 1 ? "1 day ago" : `${d} days ago`;
}

// =========================================================
// Error boundary — a render crash shows a recovery screen, not a blank page
// =========================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  componentDidCatch(err) { console.error("Console crashed:", err); }
  render() {
    if (!this.state.failed) return this.props.children;
    return (
      <div style={s.loginWrap}>
        <div style={s.loginPanel}>
          <div style={s.loginBar}><span style={s.loginBarLeft}>Veyrathis Admin — Error</span></div>

            <button type="button" style={s.primaryButton} onClick={() => window.location.reload()}>Reload console</button>

        </div>
      </div>
    );
  }
}

const ACTION_TYPES = [
  { value: "set_credits", label: "Set credits to…", field: "value", verb: "Set credits" },
  { value: "add_credits", label: "Add / subtract credits", field: "delta", verb: "Adjust credits" },

];

function ActionForm({ onActionComplete, token, prefillUserId, prefillUsername }) {
  const [robloxUserId, setRobloxUserId] = useState(prefillUserId || "");
  const [robloxUsername, setRobloxUsername] = useState(prefillUsername || "");
  const [actionType, setActionType] = useState("set_credits");
  const [amount, setAmount] = useState("");
  const [reason, setReason] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);
  const [lookingUp, setLookingUp] = useState(false);

  useEffect(() => {
    if (prefillUserId) setRobloxUserId(prefillUserId);
    if (prefillUsername) setRobloxUsername(prefillUsername);
  }, [prefillUserId, prefillUsername]);

  const selectedAction = ACTION_TYPES.find(a => a.value === actionType);

  async function resolveUsername() {
    if (!robloxUsername.trim()) return;
    setLookingUp(true);
    setResult(null);
    try {
      const data = await api(ROBLOX_LOOKUP_URL, { token, body: { username: robloxUsername.trim() } });
      if (data && data.data && data.data.length) {
        setRobloxUserId(String(data.data[0].id));
        setResult({ ok: true, message: `Found: ${data.data[0].name} (UserId ${data.data[0].id})` });
      } else {
        setResult({ ok: false, message: "No Roblox user found with that username." });
      }
    } catch (err) {
      setResult({ ok: false, message: err.status === 0 ? "Lookup failed — the lookup service may be unreachable. You can still enter a UserId directly." : err.message });
    } finally {
      setLookingUp(false);
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setResult(null);

    const userId = Number(robloxUserId);
    const amountNum = Number(amount);

    if (!userId || !Number.isFinite(userId)) {
      setResult({ ok: false, message: "Enter a valid numeric Roblox UserId (or look one up by username above)." });
      return;
    }
    if (!Number.isFinite(amountNum)) {
      setResult({ ok: false, message: "Enter a valid number for the amount." });
      return;
    }

    setSubmitting(true);
    try {
      const json = await api(FUNCTION_URL, {
        token,
        body: {
          roblox_user_id: userId,
          roblox_username: robloxUsername.trim() || null,
          action_type: actionType,
          payload: { [selectedAction.field]: amountNum },
          reason: reason.trim() || null,
        },
      });
      const deliveryNote = json.delivery_method === "live"
        ? "Delivered live — the player will see it within a couple seconds if online."
        : "Player appears offline — queued, will apply on their next join.";
      setResult({ ok: true, message: `${selectedAction.verb} → ${amountNum}. ${deliveryNote}` });
      setAmount("");
      setReason("");
      if (onActionComplete) onActionComplete();
    } catch (err) {
      setResult({ ok: false, message: err.message });
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <form onSubmit={handleSubmit} style={s.form}>
      <fieldset style={s.fieldset}>
        <legend style={s.legend}>Target player</legend>
        <div style={s.row}>
          <input type="text" placeholder="Roblox username" value={robloxUsername} onChange={e => setRobloxUsername(e.target.value)} style={{ ...s.input, flex: 1 }} />
          <button type="button" onClick={resolveUsername} disabled={lookingUp || !robloxUsername.trim()} style={s.secondaryButton}>
            {lookingUp ? "…" : "Resolve"}
          </button>
        </div>
        <input type="text" inputMode="numeric" placeholder="Roblox UserId (numeric)" value={robloxUserId}
          onChange={e => setRobloxUserId(e.target.value.replace(/[^0-9]/g, ""))} required style={s.input} />
      </fieldset>

      <fieldset style={s.fieldset}>
        <legend style={s.legend}>Action</legend>
        <select value={actionType} onChange={e => setActionType(e.target.value)} style={s.input}>
          {ACTION_TYPES.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
        </select>
        <input type="number" placeholder={selectedAction.field === "delta" ? "Amount (use − for subtract)" : "New value"}
          value={amount} onChange={e => setAmount(e.target.value)} required style={s.input} />
        <input type="text" placeholder="Reason (optional, shown in audit log)" value={reason} onChange={e => setReason(e.target.value)} style={s.input} />
      </fieldset>

      {result && <div style={result.ok ? s.resultOk : s.resultError} role="status">{result.ok ? "✓" : "⚠"} {result.message}</div>}

      <button type="submit" disabled={submitting} style={s.primaryButton}>
        {submitting ? "Sending…" : selectedAction.verb}
      </button>
    </form>
  );
}

function formatDuration(totalSeconds) {
  if (totalSeconds === null || totalSeconds === undefined) return "—";
  const sTotal = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(sTotal / 3600);
  const m = Math.floor((sTotal % 3600) / 60);
  const sec = sTotal % 60;
  return `${h}h ${m}m ${sec}s`;
}

function formatJoinDate(unixSeconds) {
  if (!unixSeconds) return "unknown";
  const d = new Date(unixSeconds * 1000);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function daysAgo(unixSeconds) {
  if (!unixSeconds) return null;
  const diffMs = Date.now() - unixSeconds * 1000;
  const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (days <= 0) return "today";
  if (days === 1) return "1 day ago";
  return `${days} days ago`;
}

// Groups a flat array of item-name strings (one entry per copy held)
// into { name, count } pairs for display.
function groupItemCounts(items) {
  const list = Array.isArray(items) ? items : [];
  const counts = new Map();
  for (const item of list) {
    const name = typeof item === "string" ? item : (item?.name || String(item));
    counts.set(name, (counts.get(name) || 0) + 1);
  }
  return Array.from(counts.entries()).map(([name, count]) => ({ name, count }));
}

function HeldItemRow({ name, count, category, onRemove, busy }) {
  const [qty, setQty] = useState(1);

  function clampQty(v) {
    const n = Math.floor(Number(v) || 1);
    return Math.max(1, Math.min(count, n));
  }

  return (
    <div style={pd.heldRow}>
      <span style={pd.heldName}>{name}</span>
      <span style={pd.heldCount}>×{count}</span>
      <input type="number" min={1} max={count} value={qty} onChange={e => setQty(clampQty(e.target.value))}
        style={pd.heldQtyInput} disabled={busy} aria-label={`Quantity of ${name} to remove`} />
      <button type="button" onClick={() => onRemove(name, category, qty)} disabled={busy} style={pd.heldRemoveBtn}>
        {busy ? "…" : "Remove"}
      </button>
    </div>
  );
}

function AddItemRow({ category, onAdd, busy }) {
  const itemsInCategory = ITEM_DATABASE[category] || [];
  const [itemName, setItemName] = useState(itemsInCategory[0] || "");
  const [qty, setQty] = useState(1);

  useEffect(() => {
    setItemName(itemsInCategory[0] || "");
  }, [category]); // eslint-disable-line react-hooks/exhaustive-deps

  if (itemsInCategory.length === 0) {
    return <div style={pd.invEmpty}>No catalogued items in this category.</div>;
  }

  return (
    <div style={pd.addRow}>
      <select value={itemName} onChange={e => setItemName(e.target.value)} style={pd.addSelect} disabled={busy} aria-label={`${category} item to grant`}>
        {itemsInCategory.map(name => <option key={name} value={name}>{name}</option>)}
      </select>
      <input type="number" min={1} max={100} value={qty}
        onChange={e => setQty(Math.max(1, Math.min(100, Math.floor(Number(e.target.value) || 1))))}
        style={pd.heldQtyInput} disabled={busy} aria-label="Quantity to grant" />
      <button type="button" onClick={() => onAdd(itemName, category, qty)} disabled={busy || !itemName} style={pd.addBtn}>
        {busy ? "…" : "Grant"}
      </button>
    </div>
  );
}

function InventoryCategory({ label, category, items, onAdd, onRemove, busyKey }) {
  const [open, setOpen] = useState(true);
  const grouped = groupItemCounts(items);
  const totalCount = grouped.reduce((sum, g) => sum + g.count, 0);

  return (
    <div style={pd.invCategory}>
      <button type="button" onClick={() => setOpen(o => !o)} style={pd.invCategoryHeader} aria-expanded={open}>
        <span style={{ ...pd.invChevron, transform: open ? "rotate(90deg)" : "rotate(0deg)" }}>▸</span>
        <span style={pd.invCategoryLabel}>{label}</span>
        <span style={pd.invCategoryCount}>{totalCount}</span>
      </button>
      {open && (
        <div style={pd.invCategoryBody}>
          {grouped.length > 0 ? (
            <div style={pd.heldList}>
              {grouped.map(g => (
                <HeldItemRow key={g.name} name={g.name} count={g.count} category={category}
                  onRemove={onRemove} busy={busyKey === `remove:${g.name}`} />
              ))}
            </div>
          ) : (
            <div style={pd.invEmpty}>Empty</div>
          )}
          <div style={pd.addRowWrap}>
            <span style={pd.addRowLabel}>Grant new item</span>
            <AddItemRow category={category} onAdd={onAdd} busy={busyKey === `add:${category}`} />
          </div>
        </div>
      )}
    </div>
  );
}

function PersonnelDatabase({ token, onEditPlayer }) {
  const [query, setQuery] = useState("");
  const [lookingUp, setLookingUp] = useState(false);
  const [error, setError] = useState(null);
  const [profile, setProfile] = useState(null);
  const [resolvedUsername, setResolvedUsername] = useState(null);
  const [invBusyKey, setInvBusyKey] = useState(null);
  const [invError, setInvError] = useState(null);

  const fetchProfile = (userId) => api(PROFILE_LOOKUP_URL, { token, body: { roblox_user_id: Number(userId) } });

  async function handleLookup(e) {
    e.preventDefault();
    setError(null);
    setInvError(null);
    setProfile(null);
    if (!query.trim()) return;

    setLookingUp(true);
    try {
      let userId = query.trim();
      let usernameForDisplay = null;

      if (!/^\d+$/.test(userId)) {
        const lookupJson = await api(ROBLOX_LOOKUP_URL, { token, body: { username: userId } });
        if (!lookupJson.data?.length) {
          setError("No Roblox user found with that username.");
          setLookingUp(false);
          return;
        }
        userId = String(lookupJson.data[0].id);
        usernameForDisplay = lookupJson.data[0].name;
      }

      const json = await fetchProfile(userId);
      setResolvedUsername(usernameForDisplay);
      setProfile(json);
    } catch (err) {
      setError(err.message || "Network error reaching the profile lookup function.");
    } finally {
      setLookingUp(false);
    }
  }

  async function submitInventoryAction(actionType, itemName, category, quantity, busyKey) {
    if (!token || !profile) return;
    setInvBusyKey(busyKey);
    setInvError(null);
    try {
      await api(INVENTORY_ACTION_URL, {
        token,
        body: {
          roblox_user_id: profile.roblox_user_id,
          roblox_username: resolvedUsername || null,
          action_type: actionType,
          payload: { itemName, category, quantity },
        },
      });
      // Refetch so the dossier shows the real post-action state.
      const refreshed = await fetchProfile(profile.roblox_user_id);
      setProfile(refreshed);
    } catch (err) {
      setInvError(err.message || "Inventory action failed.");
    } finally {
      setInvBusyKey(null);
    }
  }

  const handleAddItem = (itemName, category, quantity) =>
    submitInventoryAction("add_item", itemName, category, quantity, `add:${category}`);
  const handleRemoveItem = (itemName, category, quantity) =>
    submitInventoryAction("remove_item", itemName, category, quantity, `remove:${itemName}`);

  return (
    <div style={pd.wrap}>
      <form onSubmit={handleLookup} style={pd.searchRow}>
        <input type="text" value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Search by Roblox UserId or username" style={{ ...s.input, flex: 1 }} />
        <button type="submit" disabled={lookingUp || !query.trim()} style={s.primaryButton}>
          {lookingUp ? "Searching…" : "Search"}
        </button>
      </form>

      {error && <div style={s.errorBox} role="alert">⚠ {error}</div>}

      {!profile && !error && !lookingUp && (
        <div style={pd.emptyState}>
          <div>Enter a Roblox UserId or username to pull a personnel record.</div>
          <div style={pd.emptyStateSub}>Records read live from ProfileStore — works for offline players too.</div>
        </div>
      )}

      {profile && (
        <ProfileDossier
          profile={profile}
          username={resolvedUsername}
          onEdit={() => onEditPlayer({ userId: String(profile.roblox_user_id), username: resolvedUsername || "" })}
          onAddItem={handleAddItem}
          onRemoveItem={handleRemoveItem}
          invBusyKey={invBusyKey}
          invError={invError}
        />
      )}
    </div>
  );
}

// Moderation — warns / strikes / kicks / bans from mod_incidents.
// Available to every console role.

const MOD_TYPE_STYLES = {
  WARN:   { color: "#8A6412", bg: "#FBF1CF" },
  STRIKE: { color: "#A8520A", bg: "#FBE5CF" },
  KICK:   { color: "#2C5F8A", bg: "#E1EDF7" },
  BAN:    { color: "#A02A1E", bg: "#FBEAE4" },
  UNBAN:  { color: "#2E7D2E", bg: "#E6F2E6" },
};
const MOD_TYPES = ["WARN", "STRIKE", "KICK", "BAN", "UNBAN"];

function formatModDuration(sec) {
  if (sec === null || sec === undefined) return null;
  if (sec < 1) return "Permanent";
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return [d && `${d}d`, h && `${h}h`, m && `${m}m`].filter(Boolean).join(" ") || `${sec}s`;
}

const fetchModIncidents = (token, userId) =>
  api(LIST_MOD_URL, { token, body: userId ? { roblox_user_id: Number(userId) } : {} });

function ModerationPanel({ token }) {
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [incidents, setIncidents] = useState([]);
  const [summary, setSummary] = useState(null);
  const [subject, setSubject] = useState(null);
  const [typeFilter, setTypeFilter] = useState("ALL");
  const reqRef = useRef(0); // ignore responses from superseded requests

  const loadFeed = useCallback(async () => {
    const id = ++reqRef.current;
    setLoading(true); setError(null); setSubject(null); setSummary(null); setTypeFilter("ALL");
    try {
      const json = await fetchModIncidents(token, null);
      if (id !== reqRef.current) return;
      setIncidents(json.incidents || []);
    } catch (err) {
      if (id !== reqRef.current) return;
      setError(err.message || "Network error loading moderation records.");
    } finally {
      if (id === reqRef.current) setLoading(false);
    }
  }, [token]);

  useEffect(() => { if (token) loadFeed(); }, [loadFeed, token]);

  async function openPlayer(userId, name) {
    const id = ++reqRef.current;
    setLoading(true); setError(null); setTypeFilter("ALL");
    try {
      const json = await fetchModIncidents(token, userId);
      if (id !== reqRef.current) return;
      setIncidents(json.incidents || []);
      setSummary(json.summary || null);
      setSubject({ userId: String(userId), name: name || null });
    } catch (err) {
      if (id !== reqRef.current) return;
      setError(err.message || "Network error loading moderation records.");
    } finally {
      if (id === reqRef.current) setLoading(false);
    }
  }

  async function handleSearch(e) {
    e.preventDefault();
    const q = query.trim();
    if (!q) return;
    if (/^\d+$/.test(q)) return openPlayer(q, null);

    setLoading(true); setError(null);
    try {
      const j = await api(ROBLOX_LOOKUP_URL, { token, body: { username: q } });
      if (!j.data?.length) {
        setError("No Roblox user found with that username.");
        setLoading(false);
        return;
      }
      await openPlayer(j.data[0].id, j.data[0].name);
    } catch (err) {
      setError(err.status === 0 ? "Network error resolving that username." : err.message);
      setLoading(false);
    }
  }

  const shown = typeFilter === "ALL" ? incidents : incidents.filter(r => r.type === typeFilter);
  const displayName = subject
    ? (subject.name || incidents[0]?.target_name || `UserId ${subject.userId}`)
    : null;

  function banBadge() {
    if (!summary) return null;
    const st = summary.ban_status;
    if (st === "permanent") return { text: "BANNED — permanent", color: "var(--xp-red)" };
    if (st === "active") return { text: `BANNED — until ${new Date(summary.ban_expires_at).toLocaleString()}`, color: "var(--xp-red)" };
    if (st === "expired") return { text: "Last ban expired", color: "var(--xp-text-faint)" };
    if (st === "lifted") return { text: "Ban lifted", color: "var(--xp-green)" };
    return { text: "No bans on record", color: "var(--xp-text-faint)" };
  }
  const badge = banBadge();

  return (
    <div style={md.wrap}>
      <form onSubmit={handleSearch} style={md.searchRow}>
        <input type="text" value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Search by Roblox UserId or username" style={{ ...s.input, flex: 1 }} />
        <button type="submit" disabled={loading || !query.trim()} style={s.primaryButton}>
          {loading ? "Searching…" : "Search"}
        </button>
        {subject && <button type="button" onClick={loadFeed} style={s.secondaryButton}>Recent</button>}
      </form>

      {error && <div style={s.errorBox} role="alert">⚠ {error}</div>}

      {subject && summary && (
        <div style={md.summaryBox}>
          <img src={avatarHeadshotUrl(subject.userId)} alt={displayName} style={md.portrait}
            onError={(e) => { e.target.style.opacity = 0.15; }} />
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={pd.name}>{displayName}</div>
            <div style={pd.userIdLine}>UserId {subject.userId}</div>
            <div style={{ marginTop: 6, fontSize: 12, fontWeight: 700, color: badge.color }}>{badge.text}</div>
            <div style={{ marginTop: 2, fontSize: 11.5, color: "var(--xp-text-dim)" }}>
              Current strikes: <b>{summary.current_strikes}</b>
            </div>
          </div>
          <div style={md.chipRow}>
            {MOD_TYPES.map(t => (
              <span key={t} style={{ ...md.chip, color: MOD_TYPE_STYLES[t].color, background: MOD_TYPE_STYLES[t].bg, borderColor: MOD_TYPE_STYLES[t].color }}>
                {t} · {summary.counts[t] || 0}
              </span>
            ))}
          </div>
        </div>
      )}

      <div style={s.panelBox}>
        <div style={s.panelBar}>
          <span style={s.panelBarLeft}>
            <span>{subject ? `Records — ${displayName}` : "Recent moderation activity"}</span>
          </span>
          <span style={s.winBtnRow}>
            <button onClick={() => (subject ? openPlayer(subject.userId, subject.name) : loadFeed())}
              style={{ ...s.winBtn, cursor: "pointer" }} disabled={loading} title="Refresh" aria-label="Refresh">⟳</button>
          </span>
        </div>
        <div style={s.panelBody}>
          <div style={{ ...s.row, marginBottom: 12, alignItems: "center" }}>
            <label style={{ fontSize: 11.5, color: "var(--xp-text-dim)", fontWeight: 700 }} htmlFor="mod-type">Type</label>
            <select id="mod-type" value={typeFilter} onChange={e => setTypeFilter(e.target.value)}
              style={{ ...s.input, width: "auto", flex: "0 0 160px" }}>
              <option value="ALL">All types</option>
              {MOD_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>

          {!error && !loading && shown.length === 0 && (
            <div style={s.empty}>
              {subject ? "No moderation records on file for this player." : "No moderation activity logged yet."}
            </div>
          )}

          <div style={md.list}>
            {shown.map(r => {
              const st = MOD_TYPE_STYLES[r.type] || { color: "var(--xp-text-dim)", bg: "var(--xp-window-light)" };
              const dur = formatModDuration(r.duration_seconds);
              return (
                <div key={r.incident_id} style={md.card}>
                  <div style={md.cardTop}>
                    <span style={{ ...md.badge, color: st.color, background: st.bg, borderColor: st.color }}>{r.type}</span>
                    <span style={md.incId}>{r.incident_id}</span>
                    <span style={md.time}>{new Date(r.created_at).toLocaleString()}</span>
                  </div>
                  {!subject && (
                    <div style={md.target}>
                      <b>{r.target_name || `uid:${r.target_user_id}`}</b>
                      <span style={md.dim}> ({r.target_user_id})</span>
                      <button type="button" style={md.linkBtn}
                        onClick={() => openPlayer(r.target_user_id, r.target_name)}>View record</button>
                    </div>
                  )}
                  <div style={md.reason}>{r.reason || "No reason provided"}</div>
                  <div style={md.meta}>
                    <span>Moderator: <b>{r.moderator_name || "unknown"}</b>{r.moderator_id ? ` (${r.moderator_id})` : ""}</span>
                    {dur && <span>Duration: <b>{dur}</b></span>}
                    {r.expires_at && <span>Expires: <b>{new Date(r.expires_at).toLocaleString()}</b></span>}
                    {r.strikes != null && <span>Strike total: <b>{r.strikes}</b></span>}
                  </div>
                  {r.notes && <div style={md.notes}>Private notes: {r.notes}</div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

  { value: "database_moderator", label: "Database Moderator" },
  { value: "owner", label: "Owner" },
];
const ROLE_BADGE = {
  owner: { color: "#8A6412", bg: "#FBF1CF" },
  database_moderator: { color: "#2C5F8A", bg: "#E1EDF7" },
  game_moderator: { color: "#2E7D2E", bg: "#E6F2E6" },
};
const USERNAME_RE = /^[A-Za-z0-9_.-]{3,32}$/;

// Unbiased random password from an unambiguous alphabet (no 0/O, 1/l/I).
function generatePassword(length = 16) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const limit = 4294967296 - (4294967296 % chars.length);
  let out = "";
  while (out.length < length) {
    const buf = new Uint32Array(length);
    crypto.getRandomValues(buf);
    for (const n of buf) {
      if (n < limit && out.length < length) out += chars[n % chars.length];
    }
  }
  return out;
}

function ConfirmDialog({ title, children, confirmWord, confirmLabel, busy, error, onCancel, onConfirm }) {
  const [typed, setTyped] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) inputRef.current.focus();
    function onKey(e) { if (e.key === "Escape" && !busy) onCancel(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [busy, onCancel]);

  const ready = typed === confirmWord;

  return (
    <div style={st.backdrop} onMouseDown={(e) => { if (e.target === e.currentTarget && !busy) onCancel(); }}>
      <div style={st.dialog} role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <div style={st.dialogBar}><span id="dlg-title">{title}</span></div>
        <div style={st.dialogBody}>
          {children}
          <label style={{ ...s.label, marginTop: 14 }}>
            Type <b style={{ color: "var(--xp-red)" }}>{confirmWord}</b> to confirm
            <input ref={inputRef} type="text" value={typed} onChange={e => setTyped(e.target.value)} style={s.input}
              autoComplete="off" spellCheck={false} disabled={busy}
              onKeyDown={e => { if (e.key === "Enter" && ready && !busy) { e.preventDefault(); onConfirm(); } }} />
          </label>
          {error && <div style={{ ...s.errorBox, marginTop: 12 }} role="alert">⚠ {error}</div>}
          <div style={st.dialogFooter}>
            <button type="button" style={s.secondaryButton} onClick={onCancel} disabled={busy}>Cancel</button>
            <button type="button" style={{ ...s.primaryButtonDanger, opacity: ready ? 1 : 0.5 }} onClick={onConfirm} disabled={!ready || busy}>
              {busy ? "Deleting…" : confirmLabel}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function StaffManagement({ token }) {
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);

  const [form, setForm] = useState({ username: "", password: "", role: "game_moderator" });
  const [showPw, setShowPw] = useState(false);
  const [ownerAck, setOwnerAck] = useState(false);
  const [creating, setCreating] = useState(false);
  const [formError, setFormError] = useState(null);
  const [created, setCreated] = useState(null);
  const [copied, setCopied] = useState(null);

  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const [deleteError, setDeleteError] = useState(null);
  const [flash, setFlash] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const json = await api(STAFF_URL, { token, body: { action: "list" } });
      setStaff(json.staff || []);
      setLoadError(null);
    } catch (err) {
      setLoadError(
        err.status === 0 || err.status === 404
          ? "Couldn't reach the staff service. If the admin-staff-manage edge function isn't deployed yet, deploy it in Supabase and refresh."
          : err.message
      );
    } finally {
      setLoading(false);
    }
  }, [token]);

  useEffect(() => { if (token) load(); }, [load, token]);

  useEffect(() => {
    if (!flash) return;
    const id = setTimeout(() => setFlash(null), 5000);
    return () => clearTimeout(id);
  }, [flash]);

  const counts = useMemo(() => {
    const c = { owner: 0, database_moderator: 0, game_moderator: 0 };
    for (const m of staff) if (m.role in c) c[m.role]++;
    return c;
  }, [staff]);

  function setField(key, value) {
    setForm(f => ({ ...f, [key]: value }));
    if (key === "role") setOwnerAck(false);
  }

  async function copyText(text, key) {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(key);
      setTimeout(() => setCopied(c => (c === key ? null : c)), 1800);
    } catch (_e) {
      setCopied("error");
    }
  }

  async function handleCreate(e) {
    e.preventDefault();
    setFormError(null);
    setCreated(null);

    const username = form.username.trim();
    if (!USERNAME_RE.test(username)) {
      setFormError("Username must be 3–32 characters: letters, numbers, dot, dash or underscore.");
      return;
    }
    if (form.password.length < 10) {
      setFormError("Password must be at least 10 characters. Use Generate for a strong one.");
      return;
    }
    if (form.role === "owner" && !ownerAck) {
      setFormError("Confirm that this account should have full owner access.");
      return;
    }

    setCreating(true);
    try {
      await api(STAFF_URL, { token, body: { action: "create", username, password: form.password, role: form.role } });
      setCreated({ username, role: form.role, password: form.password });
      setForm({ username: "", password: "", role: "game_moderator" });
      setOwnerAck(false);
      setShowPw(false);
      await load();
    } catch (err) {
      setFormError(err.message);
    } finally {
      setCreating(false);
    }
  }

  async function confirmDelete() {
    if (!deleteTarget) return;
    setDeleting(true);
    setDeleteError(null);
    try {
      await api(STAFF_URL, { token, body: { action: "delete", id: deleteTarget.id } });
      setFlash(`Deleted ${deleteTarget.username}. Any open sessions were signed out.`);
      setDeleteTarget(null);
      await load();
    } catch (err) {
      setDeleteError(err.message);
    } finally {
      setDeleting(false);
    }
  }

  const roleInfo = ROLES[form.role];

  return (
    <div style={st.layout} className="vey-grid">
      {/* ---------- create account ---------- */}
      <div style={s.panelBox}>
        <div style={s.panelBar}>
          <span style={s.panelBarLeft}><span>Create account</span></span>
          <span style={s.panelBarTag}>Owner</span>
        </div>
        <div style={s.panelBody}>
          <form onSubmit={handleCreate} style={s.form} autoComplete="off">
            <fieldset style={s.fieldset}>
              <legend style={s.legend}>Credentials</legend>
              <input type="text" placeholder="Username" value={form.username} onChange={e => setField("username", e.target.value)}
                required style={s.input} autoComplete="off" spellCheck={false} autoCapitalize="none" disabled={creating} aria-label="Username" />
              <div style={s.row}>
                <input type={showPw ? "text" : "password"} placeholder="Password (10+ characters)" value={form.password}
                  onChange={e => setField("password", e.target.value)} required style={{ ...s.input, flex: 1 }}
                  autoComplete="new-password" disabled={creating} aria-label="Password" />
                <button type="button" style={s.secondaryButton} onClick={() => setShowPw(v => !v)} aria-pressed={showPw}>{showPw ? "Hide" : "Show"}</button>
              </div>
              <button type="button" style={{ ...s.secondaryButton, height: 30 }} disabled={creating}
                onClick={() => { setField("password", generatePassword(16)); setShowPw(true); }}>
                Generate strong password
              </button>
            </fieldset>

            <fieldset style={s.fieldset}>
              <legend style={s.legend}>Role</legend>
              <select value={form.role} onChange={e => setField("role", e.target.value)} style={s.input} disabled={creating} aria-label="Role">
                {STAFF_ROLE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
              <div style={st.roleBlurb}>{roleInfo ? roleInfo.blurb : ""}</div>
              {form.role === "owner" && (
                <label style={st.ackRow}>
                  <input type="checkbox" checked={ownerAck} onChange={e => setOwnerAck(e.target.checked)} disabled={creating} />
                  <span>This account gets full access, including creating and deleting staff.</span>
                </label>
              )}
            </fieldset>

            {formError && <div style={s.resultError} role="alert">⚠ {formError}</div>}

            <button type="submit" disabled={creating} style={s.primaryButton}>
              {creating ? "Creating…" : "Create account"}
            </button>
          </form>

          {created && (
            <div style={st.credCard} role="status">
              <div style={st.credTitle}>✓ Account created</div>
              <div style={st.credNote}>The password is shown here once. Send it to {created.username} through a private channel.</div>
              <div style={st.credRow}><span style={st.credLabel}>Username</span><code style={st.credValue}>{created.username}</code>
                <button type="button" style={st.credCopy} onClick={() => copyText(created.username, "u")}>{copied === "u" ? "Copied" : "Copy"}</button></div>
              <div style={st.credRow}><span style={st.credLabel}>Password</span><code style={st.credValue}>{created.password}</code>
                <button type="button" style={st.credCopy} onClick={() => copyText(created.password, "p")}>{copied === "p" ? "Copied" : "Copy"}</button></div>
              <div style={st.credRow}><span style={st.credLabel}>Role</span><span style={st.credValue}>{roleLabel(created.role)}</span></div>
              {copied === "error" && <div style={{ ...st.credNote, color: "var(--xp-red)" }}>Couldn't access the clipboard. Select the text and copy it manually.</div>}
              <button type="button" style={{ ...s.secondaryButton, marginTop: 10, height: 28 }} onClick={() => setCreated(null)}>Dismiss</button>
            </div>
          )}
        </div>
      </div>

      {/* ---------- accounts list ---------- */}
      <div style={s.panelBox}>
        <div style={s.panelBar}>
          <span style={s.panelBarLeft}><span>Accounts</span></span>
          <span style={s.winBtnRow}>
            <button onClick={load} style={{ ...s.winBtn, cursor: "pointer" }} disabled={loading} title="Refresh" aria-label="Refresh">⟳</button>
          </span>
        </div>
        <div style={s.panelBody}>
          <div style={st.chipRow}>
            {STAFF_ROLE_OPTIONS.slice().reverse().map(o => (
              <span key={o.value} style={{ ...md.chip, color: ROLE_BADGE[o.value].color, background: ROLE_BADGE[o.value].bg, borderColor: ROLE_BADGE[o.value].color }}>
                {o.label} · {counts[o.value]}
              </span>
            ))}
          </div>

          {flash && <div style={{ ...s.resultOk, marginBottom: 12 }} role="status">✓ {flash}</div>}
          {loadError && <div style={s.errorBox} role="alert">⚠ {loadError}</div>}
          {!loadError && !loading && staff.length === 0 && <div style={s.empty}>No accounts found.</div>}

          <div style={st.list}>
            {staff.map(m => {
              const badge = ROLE_BADGE[m.role] || { color: "var(--xp-text-dim)", bg: "var(--xp-window-light)" };
              return (
                <div key={m.id} style={st.item}>
                  <div style={st.itemMain}>
                    <div style={st.itemName}>
                      {m.username}
                      {m.is_you && <span style={st.youTag}>You</span>}
                    </div>
                    <div style={st.itemSub}>
                      Created {formatDateTime(m.created_at)}
                    </div>
                  </div>
                  <span style={{ ...md.badge, color: badge.color, background: badge.bg, borderColor: badge.color, whiteSpace: "nowrap" }}>{roleLabel(m.role)}</span>
                  <div style={st.itemMeta}>
                    <div>Last sign-in: <b>{relativeTime(m.last_login)}</b></div>
                    <div>{m.active_sessions > 0 ? <span style={{ color: "var(--xp-green)" }}>● {m.active_sessions} active session{m.active_sessions === 1 ? "" : "s"}</span> : "No active sessions"}</div>
                  </div>
                  <button type="button" style={{ ...s.primaryButtonDanger, padding: "5px 12px", fontSize: 11 }}
                    disabled={m.is_you} title={m.is_you ? "You can't delete your own account" : `Delete ${m.username}`}
                    onClick={() => { setDeleteError(null); setDeleteTarget(m); }}>
                    Delete
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {deleteTarget && (
        <ConfirmDialog
          title="Delete staff account"
          confirmWord={deleteTarget.username}
          confirmLabel="Delete account"
          busy={deleting}
          error={deleteError}
          onCancel={() => { if (!deleting) setDeleteTarget(null); }}
          onConfirm={confirmDelete}
        >
          <p style={{ margin: 0, lineHeight: 1.55 }}>
            This permanently deletes <b>{deleteTarget.username}</b> ({roleLabel(deleteTarget.role)}) and signs out any open sessions.
            Their past activity stays in the Activity Log.
          </p>
        </ConfirmDialog>
      )}
    </div>
  );
}

function readStored(key) {
  try { return sessionStorage.getItem(key); } catch (_e) { return null; }
}

function App() {
  const [token, setToken] = useState(() => readStored("admin_token"));
  const [adminInfo, setAdminInfo] = useState(() => {
    try { const raw = readStored("admin_info"); return raw ? JSON.parse(raw) : null; } catch (_e) { return null; }
  });
  const [notice, setNotice] = useState(null);
  const [refreshSignal, setRefreshSignal] = useState(0);
  const [requestedTab, setRequestedTab] = useState(null);
  const [prefill, setPrefill] = useState({ userId: "", username: "" });
  const [pendingCount, setPendingCount] = useState(0);
  const [lastSync, setLastSync] = useState("—");

  // Tell the boot screen the interface is ready.
  useEffect(() => { if (window.__veyBootReady) window.__veyBootReady(); }, []);

  const allowedTabs = useMemo(() => tabsForRole(adminInfo && adminInfo.role), [adminInfo]);
  const activeTab = allowedTabs.includes(requestedTab) ? requestedTab : (allowedTabs[0] || null);
  const canSeeActions = allowedTabs.includes("actions");

  const handleLoginSuccess = useCallback((newToken, admin) => {
    try {
      sessionStorage.setItem("admin_token", newToken);
      sessionStorage.setItem("admin_info", JSON.stringify(admin));
    } catch (_e) { /* storage unavailable — session lasts until reload */ }
    setNotice(null);
    setRequestedTab(null);
    setToken(newToken);
    setAdminInfo(admin);
  }, []);

  const handleSignOut = useCallback((message) => {
    try {
      sessionStorage.removeItem("admin_token");
      sessionStorage.removeItem("admin_info");
    } catch (_e) { /* ignore */ }
    setToken(null);
    setAdminInfo(null);
    setRequestedTab(null);
    setPrefill({ userId: "", username: "" });
    setPendingCount(0);
    setNotice(typeof message === "string" ? message : null);
  }, []);

  // Any 401 from any endpoint signs the user out cleanly.
  useEffect(() => {
    unauthorizedHandler = () => handleSignOut("Your session expired. Sign in again to continue.");
    return () => { unauthorizedHandler = null; };
  }, [handleSignOut]);

  const handleEditFromProfile = useCallback(({ userId, username }) => {
    setPrefill({ userId, username });
    setRequestedTab("actions");
  }, []);

  // Pending-count poll — only for roles that can see the Actions log.
  useEffect(() => {
    if (!token || !canSeeActions) return;
    let cancelled = false;
    async function poll() {
      try {
        const json = await api(LIST_ACTIONS_URL, { token });
        if (cancelled) return;
        if (json.actions) {
          setPendingCount(json.actions.filter(r => r.status === "pending" || r.status === "broadcast").length);
        }
        setLastSync(new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }));
      } catch (_err) { /* silent — top strip is non-critical */ }
    }
    poll();
    const id = setInterval(poll, 15000);
    return () => { cancelled = true; clearInterval(id); };
  }, [token, refreshSignal, canSeeActions]);

  if (!token || !adminInfo) return <Login onLoginSuccess={handleLoginSuccess} notice={notice} />;

  return (
    <div style={s.desktopWrap} className="vey-desktop">
      <div style={s.shell} className="vey-shell">
        <Sidebar tabs={allowedTabs} activeTab={activeTab} setActiveTab={setRequestedTab} adminInfo={adminInfo} onSignOut={handleSignOut} />

        <div style={s.mainCol}>
          <div style={s.appTitleBar}>
            <span style={s.appTitleBarLeft}>
              <span style={s.appTitleBarIcon}>◆</span>
              <span>Veyrathis Admin Console</span>
            </span>
            <span style={s.winBtnRow}>
              <span style={s.winBtn}>_</span>
              <span style={s.winBtn}>□</span>
              <span style={{ ...s.winBtn, ...s.winBtnClose }}>×</span>
            </span>
          </div>
          <TopStrip pendingCount={pendingCount} lastSync={lastSync} activeTab={activeTab} showPending={canSeeActions} />

          {!activeTab && (
            <main style={{ ...s.contentGrid, gridTemplateColumns: "1fr", maxWidth: 640 }} className="vey-grid">
              <div style={s.panelBox}>
                <div style={s.panelBar}><span style={s.panelBarLeft}><span>No access</span></span></div>
                <div style={s.panelBody}>
                  <div style={s.errorBox}>⚠ Your account role ({roleLabel(adminInfo.role)}) isn't assigned to any console section.</div>
                  <p style={{ ...s.loginPrompt, marginTop: 12 }}>Ask an owner to update your role, then sign in again.</p>
                </div>
              </div>
            </main>
          )}

          {activeTab === "actions" && (
            <main style={s.contentGrid} className="vey-grid">
              <div style={s.panelBox}>
                <div style={s.panelBar}>
                  <span style={s.panelBarLeft}>
                    <span style={s.panelBarPath}>Set Credits / XP</span>
                  </span>
                  <span style={s.panelBarTag}>Form</span>
                </div>
                <div style={s.panelBody}>
                  <ActionForm token={token} onActionComplete={() => setRefreshSignal(n => n + 1)}
                    prefillUserId={prefill.userId} prefillUsername={prefill.username} />
                </div>
              </div>
              <ActionHistory token={token} refreshSignal={refreshSignal} />
            </main>
          )}

          {activeTab === "personnel" && (
            <main style={{ ...s.contentGrid, gridTemplateColumns: "1fr", maxWidth: 780 }} className="vey-grid">
              <PersonnelDatabase token={token} onEditPlayer={handleEditFromProfile} />
            </main>
          )}
          {activeTab === "moderation" && (
            <main style={{ ...s.contentGrid, gridTemplateColumns: "1fr", maxWidth: 900 }} className="vey-grid">
              <ModerationPanel token={token} />
            </main>
          )}
          {activeTab === "activity" && (
            <main style={{ ...s.contentGrid, gridTemplateColumns: "1fr", maxWidth: 900 }} className="vey-grid">
              <ActivityLog token={token} />
            </main>
          )}
          {activeTab === "staff" && (
            <main style={{ padding: 0 }}>
              <StaffManagement token={token} />
            </main>
          )}

          <div style={s.statusBar}>
            <span style={s.statusBarCell}>Ready</span>
            <span style={{ ...s.statusBarCell, ...s.statusBarCellGrow }}></span>
            <span style={s.statusBarCell}>{roleLabel(adminInfo.role)}</span>
          </div>
        </div>
      </div>
    </div>
  );
}
