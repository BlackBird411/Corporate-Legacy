<style>
  /* =========================================================
     VEYRATHIS OPERATIONS CONSOLE — classified-terminal skin
     Same brass/gold palette as before, set on near-black surfaces.
     ========================================================= */
  :root {
    color-scheme: dark;

    --bg: #05070b;
    --panel: #0b0f16;
    --field: #070a10;

    --gold: #D8B34A;
    --gold-bright: #F0CF6A;
    --gold-core: #B4901E;
    --gold-deep: #8A6412;
    --gold-dim: #A8996A;

    --line: rgba(216, 179, 74, 0.22);
    --line-2: rgba(216, 179, 74, 0.45);

    --text: #EAE3CE;
    --text-dim: #B7AE92;
    --text-faint: #7E7761;

    --green: #5BC98A;
    --red: #E0603C;
    --blue: #5AA9E6;

    --mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace;
    --body: 'Rajdhani', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --display: 'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  body::before {            /* grid + glow behind everything */
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse at 78% -12%, rgba(180,144,30,0.14), transparent 55%),
      radial-gradient(ellipse at -5% 112%, rgba(216,179,74,0.08), transparent 50%),
      linear-gradient(rgba(216,179,74,0.045) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(216,179,74,0.045) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--bg);
  }
  body::after {             /* fine CRT line texture */
    content: ""; position: fixed; inset: 0; z-index: 9000; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0, rgba(255,255,255,0.016) 1px, transparent 1px, transparent 3px);
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  a { color: var(--gold-bright); }
  :focus-visible { outline: 1px solid var(--gold-bright); outline-offset: 2px; }
  ::selection { background: var(--gold-core); color: #07090d; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
  ::-webkit-scrollbar-thumb { background: rgba(216,179,74,0.35); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(216,179,74,0.6); }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @keyframes scan-y { 0% { top: -8%; } 100% { top: 108%; } }
  @keyframes granted-life { 0% { opacity: 0; } 14% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
  @keyframes granted-in { from { opacity: 0; letter-spacing: 0.9em; filter: blur(6px); } to { opacity: 1; letter-spacing: 0.38em; filter: none; } }
  @keyframes line-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

  /* ---------------- classification banner ---------------- */
  .v-banner {
    background: linear-gradient(90deg, #8A6412, #D8B34A 50%, #8A6412);
    color: #120d02; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.2em;
    text-align: center; padding: 3px 12px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------------- app frame ---------------- */
  .v-app { min-height: 100vh; display: flex; flex-direction: column; }
  .v-shell { flex: 1; display: flex; min-height: 0; }
  .v-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .v-content { flex: 1; padding: 22px 26px 34px; }

  /* ---------------- left rail ---------------- */
  .v-rail {
    width: 244px; flex: 0 0 244px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(14,19,27,0.94), rgba(8,11,17,0.94));
  }
  .v-brand { display: flex; align-items: center; gap: 12px; }
  .v-brand-name { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.22em; color: var(--gold-bright); }
  .v-brand-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; color: var(--text-faint); margin-top: 2px; }

  .v-operator { border: 1px solid var(--line); padding: 11px 12px; display: flex; gap: 11px; align-items: center; background: rgba(216,179,74,0.04); position: relative; }
  .v-operator::before { content: ""; position: absolute; top: -1px; left: -1px; width: 9px; height: 9px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
  .v-avatar { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border: 1px solid var(--line-2); font-family: var(--display); font-size: 13px; color: var(--gold-bright); background: #06080d; }
  .v-op-name { font-weight: 700; font-size: 16px; letter-spacing: 0.04em; word-break: break-all; line-height: 1.1; }
  .v-op-meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; color: var(--gold-dim); margin-top: 3px; text-transform: uppercase; }

  .v-nav-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.22em; color: var(--text-faint); text-transform: uppercase; }
  .v-nav { display: flex; flex-direction: column; gap: 4px; }
  .v-nav-item {
    position: relative; text-align: left; background: transparent; border: 1px solid transparent; color: var(--text-dim);
    padding: 10px 12px 10px 16px; font-weight: 700; font-size: 14.5px; letter-spacing: 0.14em; text-transform: uppercase;
    transition: color .15s, background .15s, border-color .15s;
  }
  .v-nav-item::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; background: transparent; transition: background .15s, box-shadow .15s; }
  .v-nav-item:hover { color: var(--gold-bright); background: rgba(216,179,74,0.06); }
  .v-nav-item.active { color: var(--gold-bright); background: linear-gradient(90deg, rgba(216,179,74,0.16), rgba(216,179,74,0.02)); border-color: var(--line); }
  .v-nav-item.active::before { background: var(--gold-bright); box-shadow: 0 0 10px rgba(240,207,106,0.8); }
  .v-rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .v-rail-note { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; color: var(--text-faint); line-height: 1.6; }

  /* ---------------- top bar ---------------- */
  .v-top {
    display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    padding: 12px 26px; border-bottom: 1px solid var(--line); background: rgba(8,11,17,0.82);
  }
  .v-crumb { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--text-faint); text-transform: uppercase; }
  .v-crumb b { color: var(--gold); font-weight: 400; }
  .v-title { margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.16em; color: var(--text); text-transform: uppercase; }
  .v-vitals { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; }
  .v-vital { display: flex; align-items: center; gap: 7px; }
  .v-vital-k { color: var(--text-faint); letter-spacing: 0.14em; }
  .v-vital-v { color: var(--text); }

  .led { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 7px; background: var(--c, var(--green)); box-shadow: 0 0 8px var(--c, var(--green)); }
  .led.pulse { animation: blink 2s ease-in-out infinite; }

  /* ---------------- panels ---------------- */
  .panel {
    position: relative; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(16,21,29,0.92), rgba(10,14,20,0.92));
    animation: fade-in .28s ease-out;
  }
  .panel::before, .panel::after { content: ""; position: absolute; width: 13px; height: 13px; border: 0 solid var(--gold); pointer-events: none; }
  .panel::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .panel::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(180,144,30,0.22), rgba(180,144,30,0) 72%);
  }
  .panel-title { font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-bright); display: flex; align-items: center; gap: 10px; }
  .panel-title::before { content: ""; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: 0 0 7px; }
  .panel-actions { display: flex; align-items: center; gap: 8px; }
  .panel-body { padding: 16px; }
  .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; color: var(--gold-dim); border: 1px solid var(--line-2); padding: 1px 8px; text-transform: uppercase; white-space: nowrap; }
  .icon-btn { background: transparent; border: 1px solid var(--line-2); color: var(--gold-bright); width: 26px; height: 24px; line-height: 1; font-size: 14px; }
  .icon-btn:hover:not(:disabled) { background: rgba(216,179,74,0.14); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; max-width: 1180px; }
  .grid-1 { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 920px; }
  .staff-layout { display: grid; grid-template-columns: minmax(310px, 390px) 1fr; gap: 20px; align-items: start; max-width: 1240px; }

  /* ---------------- forms ---------------- */
  .col { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-dim); }
  .lbl-wrap { display: flex; flex-direction: column; gap: 6px; }
  .field {
    width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--line); border-bottom-color: var(--line-2);
    border-radius: 0; padding: 9px 11px; font-family: var(--mono); font-size: 13.5px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field::placeholder { color: var(--text-faint); }
  .field:focus { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(216,179,74,0.35), 0 0 16px rgba(216,179,74,0.16); }
  .field:disabled { opacity: 0.55; }
  select.field { cursor: pointer; }
  select.field option { background: #0b0f16; color: var(--text); }
  .field.sm { padding: 6px 8px; font-size: 12.5px; }
  .field.qty { width: 62px; text-align: center; padding-left: 4px; padding-right: 4px; }
  input[type="checkbox"] { accent-color: #D8B34A; }

  .fs { border: 1px solid var(--line); margin: 0; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .fs legend { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--gold); padding: 0 7px; text-transform: uppercase; }

  .btn {
    font-family: var(--display); font-weight: 500; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 10px 20px; border: 1px solid var(--gold); background: transparent; color: var(--gold-bright);
    transition: background .15s, color .15s, box-shadow .15s, filter .15s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: rgba(216,179,74,0.14); box-shadow: 0 0 14px rgba(216,179,74,0.22); }
  .btn-primary {
    background: linear-gradient(180deg, #F0CF6A, #C9A237 55%, #B4901E); color: #120d02; border-color: #F0CF6A; font-weight: 700;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #FFE08A, #D8B34A 55%, #C9A237); box-shadow: none; filter: drop-shadow(0 0 8px rgba(240,207,106,0.5)); }
  .btn-danger { border-color: var(--red); color: #FFB4A0; }
  .btn-danger:hover:not(:disabled) { background: rgba(224,96,60,0.18); box-shadow: 0 0 14px rgba(224,96,60,0.25); }
  .btn-danger.solid { background: linear-gradient(180deg, #E0603C, #A83A1F); color: #fff; font-weight: 700; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .btn-sm { padding: 6px 12px; font-size: 10.5px; letter-spacing: 0.14em; }
  .btn-link { background: none; border: none; color: var(--gold-bright); text-decoration: underline; padding: 0 6px; font-size: 12.5px; }

  .note { border: 1px solid var(--line); border-left: 3px solid var(--c, var(--gold)); background: color-mix(in srgb, var(--c, var(--gold)) 10%, transparent); padding: 9px 12px; font-size: 14px; line-height: 1.45; }
  .note.err { --c: var(--red); color: #FFC4B2; }
  .note.ok { --c: var(--green); color: #BDEBD0; }
  .note.warn { --c: var(--gold); color: var(--gold-bright); }
  .empty { color: var(--text-faint); font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.06em; padding: 24px 0; text-align: center; }

  .badge { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 1px 8px; white-space: nowrap; }

  /* ---------------- log tables ---------------- */
  .log-scroll { overflow-x: auto; border: 1px solid var(--line); }
  .log { min-width: 560px; }
  .log-row { display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: baseline; padding: 7px 12px; border-bottom: 1px solid rgba(216,179,74,0.08); font-family: var(--mono); font-size: 12.5px; }
  .log-row:nth-child(even) { background: rgba(216,179,74,0.03); }
  .log-head { background: rgba(216,179,74,0.1) !important; color: var(--gold); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  .log-feed { max-height: 420px; overflow-y: auto; }
  .log-sub { grid-column: 1 / -1; color: var(--text-faint); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .c-faint { color: var(--text-faint); } .c-dim { color: var(--text-dim); } .c-gold { color: var(--gold-bright); }
  .ta-r { text-align: right; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------------- personnel dossier ---------------- */
  .dossier-body { display: flex; gap: 24px; padding: 20px 18px; }
  .portrait { position: relative; width: 104px; height: 104px; border: 1px solid var(--line-2); background: #05070b; overflow: hidden; flex: 0 0 104px; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.4) sepia(0.35) contrast(1.05); display: block; }
  .portrait::after { content: ""; position: absolute; left: 0; right: 0; height: 22%; top: -8%; background: linear-gradient(180deg, transparent, rgba(240,207,106,0.28), transparent); animation: scan-y 3.2s linear infinite; pointer-events: none; }
  .stamp { margin-top: 9px; text-align: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 6px; color: var(--green); border: 1px solid var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .stamp.bad { color: var(--red); border-color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }
  .subject-name { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.1em; color: var(--text); }
  .subject-id { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--text-faint); margin-top: 2px; }
  .credit-chip { font-family: var(--mono); font-size: 12.5px; color: var(--gold-bright); border: 1px solid var(--gold); padding: 3px 11px; background: rgba(216,179,74,0.1); }
  .hair { height: 1px; background: var(--line); margin: 12px 0; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 20px; }
  .stat-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; color: var(--gold-dim); text-transform: uppercase; }
  .stat-v { font-family: var(--mono); font-size: 15px; color: var(--text); margin-top: 2px; }
  .stat-s { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .section-bar { padding: 7px 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); background: rgba(216,179,74,0.09); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .inv-wrap { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px 18px; }
  .cat { border: 1px solid var(--line); background: rgba(5,7,11,0.5); }
  .cat-head { width: 100%; display: flex; align-items: center; gap: 9px; background: rgba(216,179,74,0.05); border: none; border-bottom: 1px solid var(--line); padding: 8px 12px; color: var(--text); text-align: left; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; }
  .cat-head .chev { color: var(--gold); transition: transform .15s; }
  .cat-count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--gold-bright); border: 1px solid var(--line-2); padding: 0 8px; }
  .cat-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
  .held { display: grid; grid-template-columns: minmax(0,1fr) auto 62px auto; gap: 9px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); background: rgba(216,179,74,0.03); }
  .held-name { font-weight: 700; letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .held-count { font-family: var(--mono); color: var(--gold-bright); font-size: 12.5px; }
  .add-wrap { border-top: 1px dashed var(--line-2); padding-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .add-row { display: grid; grid-template-columns: minmax(0,1fr) 62px auto; gap: 9px; align-items: center; }
  .hist { margin: 0 18px 18px; border: 1px solid var(--line); }
  .hist-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid rgba(216,179,74,0.08); font-family: var(--mono); font-size: 12.5px; }
  .dossier-foot { padding: 0 18px 20px; display: flex; justify-content: flex-end; }
  .search-empty { border: 1px dashed var(--line-2); padding: 46px 24px; text-align: center; color: var(--text-dim); display: flex; flex-direction: column; gap: 8px; align-items: center; }

  /* ---------------- moderation ---------------- */
  .subject-box { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 14px; border: 1px solid var(--line); background: rgba(216,179,74,0.04); }
  .subject-box .portrait { width: 70px; height: 70px; flex-basis: 70px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .case-list { display: flex; flex-direction: column; gap: 9px; max-height: 580px; overflow-y: auto; }
  .case { border: 1px solid var(--line); border-left: 3px solid var(--c); background: rgba(216,179,74,0.03); padding: 10px 13px; display: flex; flex-direction: column; gap: 6px; }
  .case-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .case-id { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  .case-time { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .case-reason { font-size: 15.5px; white-space: pre-wrap; word-break: break-word; }
  .case-meta { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
  .case-meta b { color: var(--text); font-weight: 400; }
  .case-notes { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); white-space: pre-wrap; word-break: break-word; border-top: 1px dashed var(--line); padding-top: 6px; }

  /* ---------------- staff ---------------- */

  .ack { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; color: #FFC4B2; border: 1px solid var(--red); background: rgba(224,96,60,0.1); padding: 8px 10px; }

  .cred-title { font-family: var(--display); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--green); margin-bottom: 5px; }
  .cred-note { font-size: 13.5px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.4; }

  .cred-k { width: 70px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; color: var(--gold-dim); text-transform: uppercase; }
  .cred-v { flex: 1; font-family: var(--mono); font-size: 13px; background: var(--field); border: 1px solid var(--line); padding: 4px 8px; word-break: break-all; }
  .roster { display: flex; flex-direction: column; gap: 9px; }
  .member { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 11px 13px; border: 1px solid var(--line); border-left: 3px solid var(--c); background: rgba(216,179,74,0.03); }
  .member-main { flex: 1 1 170px; min-width: 0; }
  .member-name { font-weight: 700; font-size: 17px; letter-spacing: 0.05em; display: flex; align-items: center; gap: 9px; word-break: break-all; }
  .member-sub { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .member-meta { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); line-height: 1.55; flex: 0 1 190px; }
  .you { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: #120d02; background: var(--gold); padding: 0 6px; text-transform: uppercase; }

  .backdrop { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2,3,6,0.78); backdrop-filter: blur(3px); }
  .dialog { width: 100%; max-width: 440px; border: 1px solid var(--red); background: #0b0f16; box-shadow: 0 0 40px rgba(224,96,60,0.18); animation: dialog-in .2s ease-out; }
  .dialog-bar { padding: 9px 14px; font-family: var(--display); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; background: linear-gradient(90deg, #A83A1F, rgba(168,58,31,0.2)); }
  .dialog-body { padding: 18px; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  /* ---------------- login ---------------- */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 18px; }
  .login-card { width: 100%; max-width: 430px; }
  .login-card.shake { animation: shake .4s; }
  .login-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .login-name { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.26em; color: var(--gold-bright); }
  .login-sub { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--text-faint); text-transform: uppercase; margin-top: 3px; }
  .login-warn { font-size: 14px; color: var(--text-dim); border-left: 2px solid var(--gold-deep); padding-left: 11px; margin: 0 0 18px; line-height: 1.45; }
  .login-foot { margin: 18px 0 0; text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--text-faint); }
  .authbar { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; }
  .authbar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--gold-bright), transparent); animation: shimmer 1s linear infinite; }

  /* ---------------- access granted overlay ---------------- */
  .granted {
    position: fixed; inset: 0; z-index: 8000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; cursor: pointer;
    background: radial-gradient(ellipse at 50% 45%, rgba(180,144,30,0.2), rgba(5,7,11,0.97) 62%);
    animation: granted-life 1.9s ease forwards;
  }
  .granted-title { margin: 0 -0.38em 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 5vw, 40px); letter-spacing: 0.38em; color: var(--gold-bright); text-shadow: 0 0 26px rgba(216,179,74,0.65); animation: granted-in .9s cubic-bezier(.2,.7,.2,1) both; text-align: center; }
  .granted-line { height: 1px; width: min(340px, 72vw); background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: line-grow .9s ease both; }
  .granted-sub { font-family: var(--mono); font-size: 13px; letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase; text-align: center; padding: 0 16px; }

  /* ---------------- responsive ---------------- */
  @media (max-width: 1000px) {
    .grid-2, .staff-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .v-shell { flex-direction: column; }
    .v-rail { width: auto; flex-basis: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .v-nav { flex-direction: row; flex-wrap: wrap; }
    .v-rail-foot { flex-direction: row; align-items: center; justify-content: space-between; margin-top: 0; }
    .v-content { padding: 16px 14px 28px; }
    .v-top { padding: 12px 14px; }
    .dossier-body { flex-direction: column; align-items: center; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    .v-banner { letter-spacing: 0.1em; font-size: 10px; }
    .held { grid-template-columns: minmax(0,1fr) auto; }
    .held .field.qty, .held .btn { grid-column: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* =========================================================
     BOOT SEQUENCE — plain HTML/CSS/JS so it paints before React
     and Babel have finished downloading and compiling.
     ========================================================= */
  #boot {
    position: fixed; inset: 0; z-index: 10000; overflow: hidden;
    background: #05070b; color: #D8C48A;
    font-family: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, transform 0.8s ease, visibility 0s linear 0.8s;
  }
  #boot.boot-exit { opacity: 0; transform: scale(1.05); visibility: hidden; pointer-events: none; }
  .boot-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(180,144,30,0.16) 0%, rgba(5,7,11,0) 58%), radial-gradient(ellipse at 50% 120%, rgba(216,179,74,0.10) 0%, rgba(5,7,11,0) 60%), #05070b; }
  .boot-grid {
    position: absolute; left: -60%; right: -60%; bottom: 0; height: 52%;
    background-image: linear-gradient(rgba(216,179,74,0.26) 1px, transparent 1px), linear-gradient(90deg, rgba(216,179,74,0.26) 1px, transparent 1px);
    background-size: 60px 60px; transform: perspective(520px) rotateX(64deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 88%); mask-image: linear-gradient(to top, #000 0%, transparent 88%);
    animation: boot-grid-move 2.4s linear infinite;
  }
  @keyframes boot-grid-move { from { background-position: 0 0; } to { background-position: 0 60px; } }
  .boot-scan { position: absolute; left: 0; right: 0; height: 2px; top: -2%; background: linear-gradient(90deg, transparent, rgba(240,207,106,0.85), transparent); box-shadow: 0 0 22px 4px rgba(216,179,74,0.35); animation: boot-scan 3.8s linear infinite; }
  @keyframes boot-scan { 0% { top: -2%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { top: 102%; opacity: 0; } }
  .boot-crt { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px); }
  .bc { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(216,179,74,0.7); }
  .bc-tl { top: 22px; left: 22px; border-top-width: 1px; border-left-width: 1px; }
  .bc-tr { top: 22px; right: 22px; border-top-width: 1px; border-right-width: 1px; }
  .bc-bl { bottom: 22px; left: 22px; border-bottom-width: 1px; border-left-width: 1px; }
  .bc-br { bottom: 22px; right: 22px; border-bottom-width: 1px; border-right-width: 1px; }
  .boot-meta { position: absolute; top: 28px; left: 58px; font-size: 11px; letter-spacing: 0.18em; color: rgba(216,196,138,0.55); }
  .boot-stage { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 20px; }
  .boot-core { position: relative; width: min(380px, 70vw); aspect-ratio: 1; }
  .boot-core svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .boot-readout { position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%); text-align: center; font-family: 'Orbitron', 'Share Tech Mono', monospace; color: #F0CF6A; text-shadow: 0 0 14px rgba(240,207,106,0.55); }
  #boot-pct { font-size: clamp(26px, 6vw, 38px); font-weight: 700; letter-spacing: 0.04em; line-height: 1; }
  .boot-unit { font-size: 10px; letter-spacing: 0.4em; margin-top: 6px; color: rgba(216,196,138,0.7); text-shadow: none; }
  .boot-title { margin: 18px -0.46em 0 0; font-family: 'Orbitron', 'Share Tech Mono', monospace; font-weight: 700; font-size: clamp(22px, 4.6vw, 34px); letter-spacing: 0.46em; color: #F3E3AE; text-align: center; text-shadow: 0 0 18px rgba(216,179,74,0.45); animation: boot-title-in 1.5s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both; transition: text-shadow 0.4s ease; }
  @keyframes boot-title-in { from { opacity: 0; letter-spacing: 1.1em; filter: blur(7px); } to { opacity: 1; letter-spacing: 0.46em; filter: blur(0); } }
  .boot-sub { margin-top: 8px; font-size: 12px; letter-spacing: 0.34em; color: rgba(216,196,138,0.75); text-align: center; min-height: 1.4em; }
  .boot-log { list-style: none; margin: 26px 0 0; padding: 0 0 0 14px; width: min(400px, 86vw); border-left: 1px solid rgba(216,179,74,0.45); }
  .boot-log li { display: flex; align-items: baseline; gap: 8px; font-size: 12px; line-height: 1.9; opacity: 0; transform: translateX(-6px); transition: opacity 0.3s ease, transform 0.3s ease; }
  .boot-log li.on { opacity: 1; transform: none; }
  .bl-n { color: #D8C48A; white-space: nowrap; }
  .bl-l { flex: 1; border-bottom: 1px dotted rgba(216,196,138,0.3); transform: translateY(-3px); min-width: 12px; }
  .bl-s { color: rgba(216,196,138,0.5); min-width: 62px; text-align: right; letter-spacing: 0.08em; }
  .bl-s.pending { animation: blink 1s ease-in-out infinite; }
  .bl-s.ok { color: #F0CF6A; }
  .bl-s.bad { color: #E0603C; }
  .boot-skip { position: absolute; bottom: -62px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 0.22em; color: rgba(216,196,138,0.45); opacity: 0; transition: opacity 0.6s ease; }
  .boot-skip.on { opacity: 1; }
  .boot-fail { margin-top: 22px; text-align: center; color: #E0603C; font-size: 12px; line-height: 1.7; max-width: 420px; }
  .boot-fail[hidden] { display: none; }
  .boot-fail button { margin-top: 10px; background: transparent; border: 1px solid #D8B34A; color: #F0CF6A; padding: 7px 18px; letter-spacing: 0.2em; font-family: inherit; }
  #boot.boot-done .boot-title { text-shadow: 0 0 30px rgba(240,207,106,0.95); }
  #boot.boot-done .boot-sub { color: #F0CF6A; }
  @media (max-width: 520px) { .boot-meta { display: none; } .boot-skip { bottom: -44px; } }

<script>
/* Boot sequence controller. Runs immediately, independent of React/Babel.
   The app calls window.__veyBootReady() once it has mounted; the sequence
   holds at 94% until then, so the animation reflects real load state. */
(function () {
  var boot = document.getElementById("boot");
  if (!boot) return;
  var root = document.getElementById("root");
  root.setAttribute("inert", "");

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MIN_MS = reduce ? 800 : 3800;
  var FAIL_MS = 15000;
  var SKIP_AFTER_MS = 700;

  var pctEl = document.getElementById("boot-pct");
  var ringEl = document.getElementById("boot-ring");
  var subEl = document.getElementById("boot-sub");
  var skipEl = document.getElementById("boot-skip");
  var failEl = document.getElementById("boot-fail");
  var svgEl = document.getElementById("boot-svg");
  var logItems = document.querySelectorAll("#boot-log li");

  var CIRC = 2 * Math.PI * 110;
  ringEl.style.strokeDasharray = CIRC;
  ringEl.style.strokeDashoffset = CIRC;
  if (reduce && svgEl.pauseAnimations) svgEl.pauseAnimations();

  var ticks = document.getElementById("boot-ticks");
  var NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 90; i++) {
    var a = (i * 4) * Math.PI / 180;
    var r1 = 170, r2 = i % 5 === 0 ? 182 : 176;
    var ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", 200 + Math.cos(a) * r1);
    ln.setAttribute("y1", 200 + Math.sin(a) * r1);
    ln.setAttribute("x2", 200 + Math.cos(a) * r2);
    ln.setAttribute("y2", 200 + Math.sin(a) * r2);
    ticks.appendChild(ln);
  }

  var appReady = false;
  var uplink = null; // null = pending, true = reachable, false = unreachable
  window.__veyBootReady = function () { appReady = true; };

  // Real reachability check (opaque response is fine — we only need to know the host answers).
  (function () {
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 5000);
    fetch(window.VEY_CONFIG.SUPABASE_URL + "/rest/v1/", { method: "GET", mode: "no-cors", signal: ctl ? ctl.signal : undefined })
      .then(function () { uplink = true; })
      .catch(function () { uplink = false; })
      .then(function () { clearTimeout(to); });
  })();

  var steps = [
    { at: 350,  hold: 450, ready: function () { return true; },          text: function () { return "READY"; } },
    { at: 1100, hold: 450, ready: function () { return uplink !== null; }, text: function () { return uplink ? "ONLINE" : "OFFLINE"; }, bad: function () { return uplink === false; } },
    { at: 1850, hold: 450, ready: function () { return appReady; },        text: function () { return "LOADED"; } },
    { at: 2600, hold: 450, ready: function () { return true; },          text: function () { return "ACTIVE"; } }
  ];
  for (var s = 0; s < steps.length; s++) {
    steps[s].node = logItems[s];
    steps[s].status = logItems[s].querySelector(".bl-s");
  }

  var t0 = performance.now(), last = t0, shown = 0, finished = false, skipping = false, failShown = false;

  function setProgress(p) {
    ringEl.style.strokeDashoffset = CIRC * (1 - p);
    pctEl.textContent = Math.round(p * 100);
  }
  function resolveStep(st) {
    st.done = true;
    st.status.textContent = st.text();
    st.status.className = "bl-s " + (st.bad && st.bad() ? "bad" : "ok");
  }

  function frame(now) {
    if (finished) return;
    var el = now - t0, dt = now - last; last = now;
    var allDone = true;

    for (var i = 0; i < steps.length; i++) {
      var st = steps[i];
      if (!st.shown && (el >= st.at || skipping)) { st.shown = true; st.node.classList.add("on"); }
      if (st.shown && !st.done && ((el >= st.at + st.hold) || skipping) && st.ready()) resolveStep(st);
      if (!st.done) allDone = false;
    }

    if (el > SKIP_AFTER_MS && !skipEl.classList.contains("on")) skipEl.classList.add("on");

    var timeP = Math.min(el / MIN_MS, 1);
    var target = (allDone || skipping) && appReady ? 1 : Math.min(timeP, 0.94);
    shown += (target - shown) * (1 - Math.exp(-dt / 140));
    setProgress(shown);

    if (appReady && (skipping || (allDone && el >= MIN_MS)) && shown > 0.985) return finish();

    if (!appReady && el > FAIL_MS && !failShown) {
      failShown = true;
      failEl.hidden = false;
      subEl.textContent = "Load failed";
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    if (finished) return;
    finished = true;
    setProgress(1);
    subEl.textContent = "Interface online";
    boot.classList.add("boot-done");
    window.removeEventListener("keydown", onSkip);
    boot.removeEventListener("pointerdown", onSkip);
    setTimeout(function () {
      boot.classList.add("boot-exit");
      root.removeAttribute("inert");
      document.documentElement.classList.add("boot-complete");
      var firstInput = root.querySelector("input");
      if (firstInput) firstInput.focus();
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 1000);
    }, reduce ? 150 : 650);
  }

  function onSkip() {
    if (performance.now() - t0 < SKIP_AFTER_MS) return;
    skipping = true;
  }
  window.addEventListener("keydown", onSkip);
  boot.addEventListener("pointerdown", onSkip);

  requestAnimationFrame(function (n) { t0 = last = n; frame(n); });
})();
</script>

// =========================================================
class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}
let unauthorizedHandler = null;

async function api(url, { token, body } = {}) {
  const headers = {};
  if (token) headers.Authorization = `Bearer ${token}`;
  if (body !== undefined) headers["Content-Type"] = "application/json";

  let res;
  try {
    res = await fetch(url, {
      method: body !== undefined ? "POST" : "GET",
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (_e) {
    throw new ApiError("Network error — check your connection and try again.", 0);
  }

  let json = null;
  try { json = await res.json(); } catch (_e) { /* non-JSON body */ }

  if (res.status === 401 && token && unauthorizedHandler) unauthorizedHandler();
  if (!res.ok || (json && json.error)) {
    throw new ApiError((json && json.error) || `Request failed (${res.status}).`, res.status);
  }
  return json || {};
}

}
function relativeTime(iso) {
  if (!iso) return "never";
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.floor(hr / 24);
  return d === 1 ? "1 day ago" : `${d} days ago`;
}

const ACTION_TYPES = [

function ActionForm({ onActionComplete, token, prefillUserId, prefillUsername }) {
  const [robloxUserId, setRobloxUserId] = useState(prefillUserId || "");
  const [robloxUsername, setRobloxUsername] = useState(prefillUsername || "");
  const [actionType, setActionType] = useState("set_credits");
  const [amount, setAmount] = useState("");
  const [reason, setReason] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);
  const [lookingUp, setLookingUp] = useState(false);

  useEffect(() => {
    if (prefillUserId) setRobloxUserId(prefillUserId);
    if (prefillUsername) setRobloxUsername(prefillUsername);
  }, [prefillUserId, prefillUsername]);

  const selectedAction = ACTION_TYPES.find(a => a.value === actionType);

  async function resolveUsername() {
    if (!robloxUsername.trim()) return;
    setLookingUp(true);
    setResult(null);
    try {
      const data = await api(ROBLOX_LOOKUP_URL, { token, body: { username: robloxUsername.trim() } });
      if (data && data.data && data.data.length) {
        setRobloxUserId(String(data.data[0].id));
        setResult({ ok: true, message: `Found: ${data.data[0].name} (UserId ${data.data[0].id})` });
      } else {
        setResult({ ok: false, message: "No Roblox user found with that username." });
      }
    } catch (err) {
      setResult({ ok: false, message: err.status === 0 ? "Lookup failed — the lookup service may be unreachable. You can still enter a UserId directly." : err.message });
    } finally {
      setLookingUp(false);
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setResult(null);

    const userId = Number(robloxUserId);
    const amountNum = Number(amount);

    if (!userId || !Number.isFinite(userId)) {
      setResult({ ok: false, message: "Enter a valid numeric Roblox UserId (or look one up by username above)." });
      return;
    }
    if (!Number.isFinite(amountNum)) {
      setResult({ ok: false, message: "Enter a valid number for the amount." });
      return;
    }

    setSubmitting(true);
    try {
      const json = await api(FUNCTION_URL, {
        token,
        body: {
          roblox_user_id: userId,
          roblox_username: robloxUsername.trim() || null,
          action_type: actionType,
          payload: { [selectedAction.field]: amountNum },
          reason: reason.trim() || null,
        },
      });
      const deliveryNote = json.delivery_method === "live"
        ? "Delivered live — the player will see it within a couple seconds if online."
        : "Player appears offline — queued, will apply on their next join.";
      setResult({ ok: true, message: `${selectedAction.verb} → ${amountNum}. ${deliveryNote}` });
      setAmount("");
      setReason("");
      if (onActionComplete) onActionComplete();
    } catch (err) {
      setResult({ ok: false, message: err.message });
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <form onSubmit={handleSubmit} className="col">
      <fieldset className="fs">
        <legend>Target player</legend>
        <div className="row">
          <input className="field grow" type="text" placeholder="Roblox username" value={robloxUsername} onChange={e => setRobloxUsername(e.target.value)} />
          <button type="button" className="btn btn-sm" onClick={resolveUsername} disabled={lookingUp || !robloxUsername.trim()}>
            {lookingUp ? "…" : "Resolve"}
          </button>
        </div>
        <input className="field" type="text" inputMode="numeric" placeholder="Roblox UserId (numeric)" value={robloxUserId}
          onChange={e => setRobloxUserId(e.target.value.replace(/[^0-9]/g, ""))} required />
      </fieldset>

      <fieldset className="fs">
        <legend>Action</legend>
        <select className="field" value={actionType} onChange={e => setActionType(e.target.value)} aria-label="Action type">
          {ACTION_TYPES.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
        </select>
        <input className="field" type="number" placeholder={selectedAction.field === "delta" ? "Amount (use − for subtract)" : "New value"}
          value={amount} onChange={e => setAmount(e.target.value)} required />
        <input className="field" type="text" placeholder="Reason (optional, shown in audit log)" value={reason} onChange={e => setReason(e.target.value)} />
      </fieldset>

      {result && <div className={"note " + (result.ok ? "ok" : "err")} role="status">{result.message}</div>}

      <button type="submit" disabled={submitting} className="btn btn-primary">
        {submitting ? "Sending…" : selectedAction.verb}
      </button>
    </form>
  );
}

// =========================================================

// =========================================================
const STATUS_STYLES = {
  pending: { color: "var(--gold)", label: "PENDING" },

  applied: { color: "var(--green)", label: "APPLIED" },

const ACTION_LABELS = {

  function formatAmount(row) {
    const p = row.payload || {};
    if (p.value !== undefined) return `→ ${p.value}`;
    if (p.delta !== undefined) return `${p.delta > 0 ? "+" : ""}${p.delta}`;

      {rows.length > 0 && (

            <div className="log-feed">
              {rows.map(row => {
                const status = STATUS_STYLES[row.status] || STATUS_STYLES.pending;
                const time = new Date(row.created_at).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
                return (
                  <div key={row.id} className="log-row" style={{ "--cols": ACTIONS_COLS }}>
                    <span className="c-faint">{time}</span>
                    <span style={{ color: status.color }}>{status.label}</span>
                    <span className="ellipsis">{row.roblox_username || `uid:${row.roblox_user_id}`}</span>
                    <span className="c-dim ellipsis">{ACTION_LABELS[row.action_type] || row.action_type}</span>
                    <span className="c-gold ta-r ellipsis">{formatAmount(row)}</span>
                    {(row.delivery_method || row.reason) && (
                      <span className="log-sub">
                        {row.delivery_method && <span className="tag">{row.delivery_method}</span>}
                        {row.reason && <span>Note: {row.reason}</span>}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </Panel>
  );
}

// Activity Log — audit trail of what each admin did in the console.
// Event types match what the edge functions actually write.

const ACTIVITY_EVENT_LABELS = {
  login: "Signed in",
  logout: "Signed out",
  view_tab: "Opened tab",
  mod_lookup: "Looked up moderation record",
  player_search: "Searched player",
  set_credits: "Set credits",
  add_credits: "Adjusted credits",
  set_xp: "Set XP",
  add_xp: "Granted XP",
  add_item: "Granted item",
  remove_item: "Removed item",
  staff_create: "Created staff account",
  staff_delete: "Deleted staff account",
};
const ACTIVITY_COLS = "130px 120px minmax(0,1fr) 150px";

function ActivityLog({ token }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [adminFilter, setAdminFilter] = useState("all");
  const [eventFilter, setEventFilter] = useState("all");

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const json = await api(LIST_ACTIVITY_URL, { token });
      setRows(json.activity || []);
      setError(null);
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  }, [token]);

  useEffect(() => { if (token) load(); }, [load, token]);

  const admins = useMemo(() => Array.from(new Set(rows.map(r => r.admin_username).filter(Boolean))).sort(), [rows]);
  const events = useMemo(() => Array.from(new Set(rows.map(r => r.event_type).filter(Boolean))).sort(), [rows]);

  const filteredRows = rows.filter(r =>
    (adminFilter === "all" || r.admin_username === adminFilter) &&
    (eventFilter === "all" || r.event_type === eventFilter));

  return (
    <Panel title="Activity log" tag="Audit" actions={<RefreshButton onClick={load} disabled={loading} />}>
      <div className="row wrap" style={{ marginBottom: 14 }}>
        <label className="lbl" htmlFor="act-admin">Admin</label>
        <select id="act-admin" className="field sm" value={adminFilter} onChange={e => setAdminFilter(e.target.value)} style={{ width: 180 }}>
          <option value="all">All admins</option>
          {admins.map(name => <option key={name} value={name}>{name}</option>)}
        </select>
        <label className="lbl" htmlFor="act-event" style={{ marginLeft: 8 }}>Event</label>
        <select id="act-event" className="field sm" value={eventFilter} onChange={e => setEventFilter(e.target.value)} style={{ width: 210 }}>
          <option value="all">All events</option>
          {events.map(ev => <option key={ev} value={ev}>{ACTIVITY_EVENT_LABELS[ev] || ev}</option>)}
        </select>
      </div>

      {error && <div className="note err">{error}</div>}
      {!error && filteredRows.length === 0 && !loading && <div className="empty">No activity matches. Actions taken in this console appear here.</div>}

      {filteredRows.length > 0 && (
        <div className="log-scroll">
          <div className="log">
            <div className="log-row log-head" style={{ "--cols": ACTIVITY_COLS }}>
              <span>Time</span><span>Admin</span><span>Event</span><span>Target</span>
            </div>
            <div className="log-feed">
              {filteredRows.map(row => {
                const time = new Date(row.created_at).toLocaleString(undefined, {
                  month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
                });
                return (
                  <div key={row.id} className="log-row" style={{ "--cols": ACTIVITY_COLS }}>
                    <span className="c-faint">{time}</span>
                    <span className="ellipsis">{row.admin_username || "unknown"}</span>
                    <span className="c-dim">{ACTIVITY_EVENT_LABELS[row.event_type] || row.event_type}</span>
                    <span className="c-gold ellipsis">{row.target || "—"}</span>
                    {row.detail && <span className="log-sub">{row.detail}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </Panel>
  );
}

function avatarHeadshotUrl(userId) {
  return `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=420&height=420&format=png`;
}

function formatDuration(totalSeconds) {
  if (totalSeconds === null || totalSeconds === undefined) return "—";
  const sTotal = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(sTotal / 3600);
  const m = Math.floor((sTotal % 3600) / 60);
  const sec = sTotal % 60;
  return `${h}h ${m}m ${sec}s`;
}

function formatJoinDate(unixSeconds) {
  if (!unixSeconds) return "unknown";
  const d = new Date(unixSeconds * 1000);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function daysAgo(unixSeconds) {
  if (!unixSeconds) return null;
  const diffMs = Date.now() - unixSeconds * 1000;
  const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (days <= 0) return "today";
  if (days === 1) return "1 day ago";
  return `${days} days ago`;
}

const INVENTORY_CATEGORIES = [
  { key: "Weapons", label: "Weapons" },
  { key: "Medical", label: "Medical" },
  { key: "Armor", label: "Armor" },
  { key: "Items", label: "Items" },
];

// Groups a flat array of item-name strings (one entry per copy held)
// into { name, count } pairs for display.
function groupItemCounts(items) {
  const list = Array.isArray(items) ? items : [];
  const counts = new Map();
  for (const item of list) {
    const name = typeof item === "string" ? item : (item?.name || String(item));
    counts.set(name, (counts.get(name) || 0) + 1);
  }
  return Array.from(counts.entries()).map(([name, count]) => ({ name, count }));
}

function HeldItemRow({ name, count, category, onRemove, busy }) {
  const [qty, setQty] = useState(1);
  const clampQty = (v) => Math.max(1, Math.min(count, Math.floor(Number(v) || 1)));

  return (
    <div className="held">
      <span className="held-name">{name}</span>
      <span className="held-count">×{count}</span>
      <input className="field sm qty" type="number" min={1} max={count} value={qty} onChange={e => setQty(clampQty(e.target.value))}
        disabled={busy} aria-label={`Quantity of ${name} to remove`} />
      <button type="button" className="btn btn-danger btn-sm" onClick={() => onRemove(name, category, qty)} disabled={busy}>
        {busy ? "…" : "Remove"}
      </button>
    </div>
  );
}

function AddItemRow({ category, onAdd, busy }) {
  const itemsInCategory = ITEM_DATABASE[category] || [];
  const [itemName, setItemName] = useState(itemsInCategory[0] || "");
  const [qty, setQty] = useState(1);

  useEffect(() => {
    setItemName(itemsInCategory[0] || "");
  }, [category]); // eslint-disable-line react-hooks/exhaustive-deps

  if (itemsInCategory.length === 0) {
    return <div className="empty" style={{ padding: "8px 0", textAlign: "left" }}>No catalogued items in this category.</div>;
  }

  return (
    <div className="add-row">
      <select className="field sm" value={itemName} onChange={e => setItemName(e.target.value)} disabled={busy} aria-label={`${category} item to grant`}>
        {itemsInCategory.map(name => <option key={name} value={name}>{name}</option>)}
      </select>
      <input className="field sm qty" type="number" min={1} max={100} value={qty}
        onChange={e => setQty(Math.max(1, Math.min(100, Math.floor(Number(e.target.value) || 1))))}
        disabled={busy} aria-label="Quantity to grant" />
      <button type="button" className="btn btn-sm" onClick={() => onAdd(itemName, category, qty)} disabled={busy || !itemName}>
        {busy ? "…" : "Grant"}
      </button>
    </div>
  );
}

function InventoryCategory({ label, category, items, onAdd, onRemove, busyKey }) {
  const [open, setOpen] = useState(true);
  const grouped = groupItemCounts(items);
  const totalCount = grouped.reduce((sum, g) => sum + g.count, 0);

  return (
    <div className="cat">
      <button type="button" className="cat-head" onClick={() => setOpen(o => !o)} aria-expanded={open}>
        <span className="chev" style={{ transform: open ? "rotate(90deg)" : "none" }}>▸</span>
        <span>{label}</span>
        <span className="cat-count">{totalCount}</span>
      </button>
      {open && (
        <div className="cat-body">
          {grouped.length > 0 ? (
            grouped.map(g => (
              <HeldItemRow key={g.name} name={g.name} count={g.count} category={category}
                onRemove={onRemove} busy={busyKey === `remove:${g.name}`} />
            ))
          ) : (
            <div className="empty" style={{ padding: "6px 0", textAlign: "left" }}>Empty</div>
          )}
          <div className="add-wrap">
            <span className="lbl">Grant new item</span>
            <AddItemRow category={category} onAdd={onAdd} busy={busyKey === `add:${category}`} />
          </div>
        </div>
      )}
    </div>
  );
}

function PersonnelDatabase({ token, onEditPlayer }) {
  const [query, setQuery] = useState("");
  const [lookingUp, setLookingUp] = useState(false);
  const [error, setError] = useState(null);
  const [profile, setProfile] = useState(null);
  const [resolvedUsername, setResolvedUsername] = useState(null);
  const [invBusyKey, setInvBusyKey] = useState(null);
  const [invError, setInvError] = useState(null);

  const fetchProfile = (userId) => api(PROFILE_LOOKUP_URL, { token, body: { roblox_user_id: Number(userId) } });

  async function handleLookup(e) {
    e.preventDefault();
    setError(null);
    setInvError(null);
    setProfile(null);
    if (!query.trim()) return;

    setLookingUp(true);
    try {
      let userId = query.trim();
      let usernameForDisplay = null;

      if (!/^\d+$/.test(userId)) {
        const lookupJson = await api(ROBLOX_LOOKUP_URL, { token, body: { username: userId } });
        if (!lookupJson.data?.length) {
          setError("No Roblox user found with that username.");
          setLookingUp(false);
          return;
        }
        userId = String(lookupJson.data[0].id);
        usernameForDisplay = lookupJson.data[0].name;
      }

      const json = await fetchProfile(userId);
      setResolvedUsername(usernameForDisplay);
      setProfile(json);
    } catch (err) {
      setError(err.message || "Network error reaching the profile lookup function.");
    } finally {
      setLookingUp(false);
    }
  }

  async function submitInventoryAction(actionType, itemName, category, quantity, busyKey) {
    if (!token || !profile) return;
    setInvBusyKey(busyKey);
    setInvError(null);
    try {
      await api(INVENTORY_ACTION_URL, {
        token,
        body: {
          roblox_user_id: profile.roblox_user_id,
          roblox_username: resolvedUsername || null,
          action_type: actionType,
          payload: { itemName, category, quantity },
        },
      });
      // Refetch so the dossier shows the real post-action state.
      const refreshed = await fetchProfile(profile.roblox_user_id);
      setProfile(refreshed);
    } catch (err) {
      setInvError(err.message || "Inventory action failed.");
    } finally {
      setInvBusyKey(null);
    }
  }

  const handleAddItem = (itemName, category, quantity) =>
    submitInventoryAction("add_item", itemName, category, quantity, `add:${category}`);
  const handleRemoveItem = (itemName, category, quantity) =>
    submitInventoryAction("remove_item", itemName, category, quantity, `remove:${itemName}`);

  return (
    <div className="col" style={{ gap: 18 }}>
      <form onSubmit={handleLookup} className="row">
        <input className="field grow" type="text" value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Search by Roblox UserId or username" aria-label="Search player" />
        <button type="submit" disabled={lookingUp || !query.trim()} className="btn btn-primary">
          {lookingUp ? "Searching…" : "Search"}
        </button>
      </form>

      {error && <div className="note err" role="alert">{error}</div>}

      {!profile && !error && !lookingUp && (
        <div className="search-empty">
          <div>Enter a Roblox UserId or username to pull a personnel record.</div>
          <div className="c-faint" style={{ fontFamily: "var(--mono)", fontSize: 12 }}>Records read live from ProfileStore — works for offline players too.</div>
        </div>
      )}

      {profile && (
        <ProfileDossier
          profile={profile}
          username={resolvedUsername}
          onEdit={() => onEditPlayer({ userId: String(profile.roblox_user_id), username: resolvedUsername || "" })}
          onAddItem={handleAddItem}
          onRemoveItem={handleRemoveItem}
          invBusyKey={invBusyKey}
          invError={invError}
        />
      )}
    </div>
  );
}

      <div className="dossier-body">

          </div>
          <div className="subject-id">UserId {profile.roblox_user_id}</div>

          {found && (

              <div className="hair"></div>

                  <div className="stat-v">{formatJoinDate(profile.first_joined)}</div>

                <div>
                  <div className="stat-k">Playtime</div>

                <div>
                  <div className="stat-k">XP / Total XP</div>
                  <div className="stat-v">{profile.xp ?? "—"} / {profile.total_xp ?? "—"}</div>

                <div>
                  <div className="stat-k">Skill points</div>
                  <div className="stat-v">{profile.skill_points ?? "—"}</div>
                </div>
                <div>
                  <div className="stat-k">Bank</div>
                  <div className="stat-v">
                    {profile.bank !== null && profile.bank !== undefined ? Number(profile.bank).toLocaleString() + " credits" : "—"}
                  </div>
                </div>
                <div>
                  <div className="stat-k">Stock portfolio</div>
                  <div className="stat-v">
                    {profile.stock_portfolio
                      ? (Array.isArray(profile.stock_portfolio) ? `${profile.stock_portfolio.length} holdings` : "on file")
                      : "—"}
                  </div>

              </div>
            </React.Fragment>
          )}
